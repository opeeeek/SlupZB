<!--@@HEAD-->
<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SłupŻB</title>
<style id="appcss">/*@@CSS@@*/</style>
</head>
<body>
<!--@@BODY-->
<header id="top">
  <div class="brand">
    <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="4" rx="1" style="fill:var(--brand1);stroke:var(--brand2)"/><rect x="9" y="6" width="14" height="23" rx="1.5" style="fill:var(--brand1);stroke:var(--brand2)"/><line x1="12.5" y1="7" x2="12.5" y2="28" stroke-width="1.8" style="stroke:var(--brand4)"/><line x1="19.5" y1="7" x2="19.5" y2="28" stroke-width="1.8" style="stroke:var(--brand4)"/><path d="M11 11h10M11 16h10M11 21h10M11 25.5h10" stroke-width="1.3" style="stroke:var(--brand3)"/></svg>
    <b>SłupŻB</b><span class="tag">PN-EN 1992-1-1</span>
  </div>
  <input id="projName" title="Nazwa elementu" aria-label="Nazwa elementu" spellcheck="false">
  <span id="fileName"></span>
  <div class="tb">
    <button id="bNew" data-act="new" title="Nowy projekt (Ctrl+N)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v4h4"/></svg><span class="lbl">Nowy</span></button>
    <button id="bOpen" data-act="open" title="Otwórz plik projektu (Ctrl+O)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h6l2 2h10v10H3z"/></svg><span class="lbl">Otwórz</span></button>
    <button id="bSave" data-act="save" title="Zapisz (Ctrl+S)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h12l3 3v15H5z"/><path d="M8 3v6h8V3M8 21v-7h8v7"/></svg><span class="lbl">Zapisz</span></button>
    <button id="bSaveAs" data-act="saveas" title="Zapisz jako (Ctrl+Shift+S)"><span class="lbl">Zapisz jako…</span></button>
    <button id="bCloud" data-act="cloud" title="Moje projekty zapisane na koncie" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 18h10a4 4 0 0 0 .6-7.95A6 6 0 0 0 6.2 9.1 4.5 4.5 0 0 0 7 18z"/></svg><span class="lbl">Moje projekty</span></button>
    <span class="sep"></span>
    <button id="bPrint" data-act="print" title="Drukuj raport / zapisz do PDF (Ctrl+P)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="8" rx="1"/><path d="M7 14h10v7H7z"/></svg><span class="lbl">Drukuj / PDF</span></button>
    <button id="bExport" data-act="exporthtml" title="Zapisz raport jako plik HTML"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M4 21h16"/></svg><span class="lbl">Raport HTML</span></button>
    <button id="bAbout" data-act="about" title="O programie" aria-label="O programie">?</button>
  </div>
  <div id="status">…</div>
</header>
<main>
  <section id="out">
    <nav class="tabs">
      <button data-tab="data" class="on">Dane</button>
      <button data-tab="sec">Przekrój i zbrojenie</button>
      <button data-tab="chart">Wykresy i interakcja N–M</button>
      <button data-tab="elev">Zbrojenie słupa</button>
      <button data-tab="sum">Podsumowanie</button>
      <button data-tab="report">Raport obliczeń</button>
    </nav>
    <div class="pane on" id="p-data"><div class="datawrap"><div class="dleft"><div id="dsum"></div><div id="autobar"></div><div id="inputs"></div></div><div class="dsplit" id="dsplit" role="separator" aria-orientation="vertical" title="Przeciągnij, aby zmienić podział: dane | schemat (dwuklik – po równo)"></div><aside id="dataside"></aside></div></div>
    <div class="pane" id="p-sum"></div>
    <div class="pane xres" id="p-sec"></div>
    <div class="pane xres" id="p-chart"></div>
    <div class="pane xres" id="p-elev"></div>
    <div class="pane" id="p-report"></div>
  </section>
</main>
<div id="pop"></div>
<div id="modal" role="dialog" aria-modal="true"></div>
<div id="toast" role="status"></div>
<input type="file" id="fileIn" accept=".slup,.json,application/json" hidden>
<!--@@FLAGS-->
<script>/*@@ENGINE@@*/</script>
<script>/*@@NORMS@@*/</script>
<script>/*@@DRAW@@*/</script>
<script>/*@@REPORT@@*/</script>
<script>/*@@DXF@@*/</script>
<script>/*@@UI@@*/</script>
<!--@@END-->
</body>
</html>
