<title>SłupŻB</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style id="appcss">/* Układ: aplikacja dwupanelowa – dane po lewej, wyniki po prawej; na telefonie przełącznik Dane / Wyniki. */
:root {
  --bg: #eef0f3; --panel: #ffffff; --panel2: #f7f8fa; --line: #d9dde3; --line2: #e8ebef;
  --ink: #1b2230; --ink2: #4a5466; --ink3: #7a8494;
  --acc: #1d5bb8; --acc2: #e8f0fc; --acc3: #0f3f86; --onacc: #ffffff; --focus: #8fb2ea;
  --ok: #1d7f3c; --okbg: #e6f4ea; --warn: #a35d00; --warnbg: #fdf1dc; --fail: #c0262d; --failbg: #fde8e8; --info: #5b6576; --infobg: #eef0f3;
  --errln: #f3c2c4; --wrnln: #f0d6a8; --ubbg: #edf0f3; --ubwarn: #d89a2b;
  --field: #ffffff; --hover: #e3e7ed; --grp: #f2f5f9; --itembg: #fbfcfe; --addln: #a9c3ec; --addhov: #d6e5fb; --dashln: #b9c6da;
  --shadow: rgba(20, 30, 50, .18); --scrim: rgba(15, 22, 35, .45); --toastbg: #1d2636; --toastink: #ffffff;
  --hdr: #172235; --hdr2: #22314b; --hdrln: #34486b; --hdrhov: #24344f; --hdrbot: #0b1220;
  --hdrink: #e9eef6; --hdrink2: #dbe4f2; --hdrmut: #8ea2c2; --hdrtag: #b8c7de; --hdrtagln: #4e6386; --hdrfocus: #5d8fe0;
  --stok: #1f6b3a; --stfail: #a8232a; --stwarn: #8a5300; --onst: #ffffff;
  --brand1: #dfe6f1; --brand2: #9fb3d4; --brand3: #b5413f; --brand4: #172235; --brand5: #3b5b8f;
  --mono: "Cascadia Mono", Consolas, "DejaVu Sans Mono", monospace;
  --ui: "Segoe UI", "Segoe UI Variable", system-ui, -apple-system, "Liberation Sans", Arial, sans-serif;
  --gl: max(16px, env(safe-area-inset-left, 0px)); --gr: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e131a; --panel: #151b24; --panel2: #1a212c; --line: #2b3443; --line2: #212937;
    --ink: #e4e9f1; --ink2: #b3bccb; --ink3: #8591a3;
    --acc: #4f8ae0; --acc2: #1b2940; --acc3: #9cc0f5; --onacc: #ffffff; --focus: #3f6db5;
    --ok: #4cbf75; --okbg: #13281b; --warn: #e2a33f; --warnbg: #2d2312; --fail: #ef6b6f; --failbg: #2e1618; --info: #9aa5b6; --infobg: #1e2531;
    --errln: #5a2a2d; --wrnln: #5a4420; --ubbg: #262f3d; --ubwarn: #e2a33f;
    --field: #0f141c; --hover: #212a38; --grp: #19212d; --itembg: #121822; --addln: #345283; --addhov: #213454; --dashln: #3a4659;
    --shadow: rgba(0, 0, 0, .5); --scrim: rgba(0, 0, 0, .6); --toastbg: #2b3546; --toastink: #ffffff;
    --hdr: #0a0f17; --hdr2: #151d2b; --hdrln: #2a3954; --hdrhov: #18233a; --hdrbot: #000000;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e131a; --panel: #151b24; --panel2: #1a212c; --line: #2b3443; --line2: #212937;
  --ink: #e4e9f1; --ink2: #b3bccb; --ink3: #8591a3;
  --acc: #4f8ae0; --acc2: #1b2940; --acc3: #9cc0f5; --onacc: #ffffff; --focus: #3f6db5;
  --ok: #4cbf75; --okbg: #13281b; --warn: #e2a33f; --warnbg: #2d2312; --fail: #ef6b6f; --failbg: #2e1618; --info: #9aa5b6; --infobg: #1e2531;
  --errln: #5a2a2d; --wrnln: #5a4420; --ubbg: #262f3d; --ubwarn: #e2a33f;
  --field: #0f141c; --hover: #212a38; --grp: #19212d; --itembg: #121822; --addln: #345283; --addhov: #213454; --dashln: #3a4659;
  --shadow: rgba(0, 0, 0, .5); --scrim: rgba(0, 0, 0, .6); --toastbg: #2b3546; --toastink: #ffffff;
  --hdr: #0a0f17; --hdr2: #151d2b; --hdrln: #2a3954; --hdrhov: #18233a; --hdrbot: #000000;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { font: 13px/1.4 var(--ui); color: var(--ink); background: var(--bg); overflow: hidden; font-variant-numeric: tabular-nums; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--hdr); }
button { font: inherit; }
sub, sup { font-size: 72%; line-height: 0; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

/* ---------- pasek górny */
#top { min-height: 50px; display: flex; align-items: center; gap: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0; background: var(--hdr); color: var(--hdrink); border-bottom: 1px solid var(--hdrbot); }
.brand { display: flex; align-items: center; gap: 8px; font-size: 16px; white-space: nowrap; }
.brand b { font-weight: 650; letter-spacing: .2px; }
.brand .tag { font-size: 11px; padding: 1px 6px; border: 1px solid var(--hdrtagln); border-radius: 3px; color: var(--hdrtag); }
#projName { width: 190px; background: var(--hdr2); border: 1px solid var(--hdrln); color: var(--hdrink); padding: 5px 8px; border-radius: 4px; font: inherit; }
#projName:focus { outline: 2px solid var(--hdrfocus); outline-offset: -1px; }
.tb { display: flex; gap: 4px; align-items: center; }
.tb button { background: transparent; color: var(--hdrink2); border: 1px solid transparent; padding: 6px 9px; border-radius: 4px; cursor: pointer; display: flex; gap: 6px; align-items: center; white-space: nowrap; }
.tb button:hover { background: var(--hdrhov); border-color: var(--hdrln); }
.tb button svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.7; flex: none; }
.tb .sep { width: 1px; height: 22px; background: var(--hdrln); margin: 0 4px; }
#status { margin-left: auto; padding: 6px 12px; border-radius: 4px; font-weight: 600; white-space: nowrap; font-size: 13px; color: var(--onst); background: var(--hdr2); }
#status.ok { background: var(--stok); } #status.fail { background: var(--stfail); } #status.warn { background: var(--stwarn); }
#fileName { color: var(--hdrmut); font-size: 12px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- układ */
main { display: flex; height: calc(100% - 50px); }
#inputs { min-width: 0; columns: 3 330px; column-gap: 14px; }
#inputs details.grp { break-inside: avoid; display: block; margin-bottom: 12px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--panel); }
.datawrap { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 18px; align-items: start; }
#dataside { position: sticky; top: 0; display: flex; flex-direction: column; gap: 12px; }
#dataside .box { padding: 10px 12px; }
#dataside .schemewrap svg { width: 100%; height: auto; }
#dataside .hint { margin: 6px 0 0; }
.schemesvg .supp { cursor: pointer; }
.schemesvg .supp:hover .suphl { fill: var(--acc2); stroke: var(--acc); }
.secedit .zhit { cursor: pointer; }
.secedit .zhit:hover { fill: var(--acc); fill-opacity: .14; stroke: var(--acc); stroke-dasharray: 4 3; }
.rebbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 0 0 12px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel2); }
.rebbar .ttl { font-weight: 650; color: var(--acc3); margin-right: 4px; font-size: 12.5px; }
.rebbar select { width: auto; height: 28px; }
.zed { display: flex; flex-direction: column; gap: 8px; }
.zed .zl { border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; background: var(--panel2); }
.zed .zl h5 { margin: 0 0 6px; font-size: 12.5px; color: var(--acc3); display: flex; align-items: center; gap: 8px; }
.zed .zl h5 .sp { flex: 1; }
.zed .zg { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 3px 0; font-size: 12.5px; color: var(--ink2); }
.zed .zg select { width: auto; height: 26px; }
.zed .zg .txt { height: 26px; width: 74px; text-align: right; }
.zed .zg .txt.wide { width: 220px; text-align: left; }
.zed .iss { font-size: 12px; color: var(--fail); }
.zed .okm { font-size: 12px; color: var(--ok); }
.dlg.zpop { max-width: 980px !important; }
.zpop .zcols { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
.zpop .zprev { position: sticky; top: 0; }
.zpop .fields { display: block; }
.suppop .zg { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0; font-size: 13px; }
.suppop label.rad { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; flex: 1 1 180px; }
.suppop label.rad.on { border-color: var(--acc); background: var(--acc2); }
.suppop .txt { width: 110px; height: 28px; text-align: right; }
.suppop label.rad svg { flex: none; }
.suppop label.rad small { color: var(--ink3); }
.suptab { margin-top: 6px; }
.suptab tr { cursor: pointer; }
.suptab tr:hover td { background: var(--acc2); }
.suptab td { font-size: 12px; padding: 3px 6px; }
.kv.suptab td:nth-child(2) { text-align: left; font-weight: 400; }
.kv.suptab td:nth-child(3) { white-space: nowrap; }
.zprev table.kv td:nth-child(2) { white-space: nowrap; }
.rebbar label.vib { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink2); margin-left: auto; }
.rebbar label.vib.vibon { cursor: pointer; }
.rebbar label.vib.vibon + label.vib { margin-left: 0; }
.rebbar label.vib.off { opacity: 0.45; }
.rebbar .btn.sm { text-align: left; }
.dlg.fpop { max-width: 620px; }
.dlg.fpop .fields { padding: 0; }
.minisec svg { max-width: 100%; height: auto; }
.zed .hint { margin: 2px 0; }
#out { flex: 1; display: flex; flex-direction: column; min-width: 0; }

/* ---------- formularz */
details.grp { border-bottom: 1px solid var(--line); }
details.grp > summary { list-style: none; cursor: pointer; padding-block: 9px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; font-weight: 650; font-size: 12.5px; letter-spacing: .3px; text-transform: uppercase; color: var(--acc3); background: var(--panel2); display: flex; align-items: center; gap: 8px; user-select: none; }
details.grp > summary::-webkit-details-marker { display: none; }
details.grp > summary::before { content: ""; width: 7px; height: 7px; border-right: 2px solid var(--ink3); border-bottom: 2px solid var(--ink3); transform: rotate(-45deg); transition: transform .12s; margin-right: 2px; }
details.grp[open] > summary::before { transform: rotate(45deg); }
.fields { padding-block: 6px 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; }
.row { display: grid; grid-template-columns: 1fr 156px 38px; align-items: center; gap: 6px; min-height: 30px; }
.row label { color: var(--ink2); font-size: 12.5px; }
.row .unit { color: var(--ink3); font-size: 11.5px; }
.row.wide { grid-template-columns: 1fr 218px; }
.hint { font-size: 11.5px; color: var(--ink3); margin: 0 0 6px; padding-left: 2px; }
.hint b { color: var(--ink2); font-weight: 600; }
select, .combo input, .txt, .mtab input { height: 26px; border: 1px solid var(--line); border-radius: 4px; background: var(--field); font: inherit; color: var(--ink); padding: 0 6px; width: 100%; }
select:focus, .combo input:focus, .txt:focus, .mtab input:focus { outline: 2px solid var(--focus); outline-offset: -1px; border-color: var(--acc); }
select { padding-right: 2px; }
.combo { display: flex; position: relative; }
.combo input { border-radius: 4px 0 0 4px; text-align: right; padding-right: 6px; }
.combo button { width: 24px; border: 1px solid var(--line); border-left: 0; background: var(--panel2); border-radius: 0 4px 4px 0; cursor: pointer; color: var(--ink2); padding: 0; }
.combo button:hover { background: var(--acc2); }
.combo input.bad, .txt.bad, .mtab input.bad { border-color: var(--fail); background: var(--failbg); }
.chk { display: flex; align-items: center; gap: 8px; min-height: 28px; color: var(--ink2); font-size: 12.5px; cursor: pointer; }
.chk input { width: 15px; height: 15px; margin: 0; accent-color: var(--acc); flex: none; }
.barrow { display: grid; grid-template-columns: 1fr 60px 14px 74px 38px; align-items: center; gap: 4px; min-height: 30px; }
.barrow .x { text-align: center; color: var(--ink3); }
.barrow label { color: var(--ink2); font-size: 12.5px; }
.mtab { width: 100%; border-collapse: collapse; margin: 4px 0 8px; }
.mtab th { font-weight: 500; color: var(--ink3); font-size: 11.5px; padding: 2px; text-align: center; }
.mtab td { padding: 2px; }
.mtab td:first-child { color: var(--ink2); font-size: 12px; white-space: nowrap; }
.mtab input { height: 25px; text-align: right; padding: 0 5px; }
#pop { position: fixed; z-index: 130; background: var(--panel); color: var(--ink); border: 1px solid var(--line); box-shadow: 0 6px 18px var(--shadow); border-radius: 4px; max-height: 260px; overflow-y: auto; display: none; min-width: 120px; }
#pop div { padding: 4px 10px; cursor: pointer; text-align: right; }
#pop div:hover, #pop div.cur { background: var(--acc2); color: var(--acc3); }

/* ---------- zakładki */
.tabs { display: flex; flex-wrap: wrap; gap: 2px; padding-block: 8px 0; padding-left: 12px; padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--bg); border-bottom: 1px solid var(--line); }
.tabs button { border: 1px solid transparent; border-bottom: 0; background: transparent; padding: 7px 14px; cursor: pointer; color: var(--ink2); border-radius: 5px 5px 0 0; font-weight: 550; }
.tabs button:hover { color: var(--ink); background: var(--hover); }
.tabs button.on { background: var(--panel); border-color: var(--line); color: var(--acc3); margin-bottom: -1px; }
.pane { display: none; flex: 1; overflow: auto; background: var(--panel); padding-block: 16px 30px; padding-left: 18px; padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.pane.on { display: block; }
.tscroll { max-width: 100%; overflow-x: auto; }

/* ---------- podsumowanie */
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(178px, 1fr)); gap: 10px; margin-bottom: 16px; }
.card { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; background: var(--panel); position: relative; overflow: hidden; min-width: 0; }
.card .t { font-size: 11.5px; color: var(--ink3); text-transform: uppercase; letter-spacing: .3px; font-weight: 600; }
.card .v { font-size: 20px; font-weight: 650; margin-top: 3px; }
.card .s { font-size: 12px; color: var(--ink2); margin-top: 1px; }
.card::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--line); }
.card.ok::before { background: var(--ok); } .card.fail::before { background: var(--fail); } .card.warn::before { background: var(--warn); }
.msgs { margin: 0 0 14px; }
.msg { padding: 7px 10px; border-radius: 4px; margin-bottom: 6px; font-size: 12.5px; }
.msg.err { background: var(--failbg); color: var(--fail); border: 1px solid var(--errln); }
.msg.wrn { background: var(--warnbg); color: var(--warn); border: 1px solid var(--wrnln); }
table.ctab { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.ctab th { text-align: left; font-weight: 600; color: var(--ink3); font-size: 11.5px; padding: 6px 8px; border-bottom: 1px solid var(--line); background: var(--panel2); position: sticky; top: -16px; z-index: 1; }
table.ctab td { padding: 5px 8px; border-bottom: 1px solid var(--line2); vertical-align: middle; }
table.ctab tr.g td { background: var(--grp); font-weight: 650; color: var(--acc3); padding-top: 9px; font-size: 12px; letter-spacing: .2px; }
table.ctab td.ref { color: var(--ink3); white-space: nowrap; font-size: 11.5px; }
table.ctab td.val { white-space: nowrap; text-align: right; font-family: var(--ui); }
table.ctab td.nt { color: var(--ink3); font-size: 11.5px; }
.ub { width: 120px; height: 8px; background: var(--ubbg); border-radius: 4px; overflow: hidden; display: inline-block; vertical-align: middle; }
.ub i { display: block; height: 100%; background: var(--ok); }
.ub.warn i { background: var(--ubwarn); } .ub.fail i { background: var(--fail); }
.pct { display: inline-block; width: 48px; text-align: right; margin-left: 6px; font-weight: 600; font-size: 12px; }
.st { display: inline-block; min-width: 26px; padding: 1px 7px; border-radius: 10px; font-size: 11px; font-weight: 700; text-align: center; }
.st.ok { background: var(--okbg); color: var(--ok); } .st.fail { background: var(--failbg); color: var(--fail); } .st.warn { background: var(--warnbg); color: var(--warn); } .st.info { background: var(--infobg); color: var(--info); }

/* ---------- przekroje i wykresy */
.h2 { font-size: 14px; font-weight: 650; margin: 4px 0 10px; color: var(--ink); text-wrap: balance; }
.h2 small { font-weight: 400; color: var(--ink3); margin-left: 6px; }
.flex { display: flex; flex-wrap: wrap; gap: 18px; align-items: flex-start; }
.flex > * { min-width: 0; }
.box { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; background: var(--panel); max-width: 100%; overflow-x: auto; }
.box h4 { margin: 0 0 6px; font-size: 12.5px; color: var(--acc3); }
svg text { font-family: var(--ui); }
.kv { border-collapse: collapse; font-size: 12.5px; }
.kv td { padding: 2px 10px 2px 0; }
.kv td:first-child { color: var(--ink2); }
.kv td:nth-child(2) { text-align: right; font-weight: 600; }
.kv td:nth-child(3) { color: var(--ink3); }
table.sched { border-collapse: collapse; font-size: 12.5px; margin-top: 10px; min-width: 640px; }
table.sched th, table.sched td { border: 1px solid var(--line); padding: 4px 8px; }
table.sched th { background: var(--panel2); font-weight: 600; color: var(--ink2); font-size: 12px; }
table.sched td.n { text-align: right; }
table.sched tr.tot td { font-weight: 700; background: var(--panel2); }

/* ---------- raport */
:is(#report, #ownrep) { max-width: 980px; margin: 0 auto; font-size: 12.5px; color: #000; background: #fff; padding: 18px 22px; border-radius: 4px;
  --ok: #1d7f3c; --warn: #a35d00; --fail: #c0262d; --info: #5b6576; --ink: #000; --ink2: #000; --ink3: #000; }
:is(#report, #ownrep) h1 { font-size: 20px; margin: 0 0 4px; text-wrap: balance; }
:is(#report, #ownrep) h2 { font-size: 15px; margin: 22px 0 8px; padding: 4px 0 0; color: #000; page-break-after: avoid; }
:is(#report, #ownrep) h3 { font-size: 13px; margin: 14px 0 6px; color: #000; page-break-after: avoid; }
:is(#report, #ownrep) p { margin: 4px 0 6px; }
:is(#report, #ownrep) .eq { padding: 2px 0 2px 14px; line-height: 1.7; page-break-inside: avoid; overflow-wrap: anywhere; color: #000; }
:is(#report, #ownrep) .eq .r { color: #000; font-size: 11px; margin-left: 8px; }
:is(#report, #ownrep) .eq b { color: #000; }
:is(#report, #ownrep) .eq .ok, :is(#report, #ownrep) .ok { color: var(--ok); font-weight: 700; } :is(#report, #ownrep) .eq .fail, :is(#report, #ownrep) .fail { color: var(--fail); font-weight: 700; } :is(#report, #ownrep) .eq .warn, :is(#report, #ownrep) .warn { color: var(--warn); font-weight: 700; }
:is(#report, #ownrep) .info { color: var(--info); font-weight: 700; }
:is(#report, #ownrep) .note { color: #000; font-size: 11.5px; font-style: italic; }
:is(#report, #ownrep) .fig { display: flex; gap: 16px; flex-wrap: wrap; margin: 8px 0; page-break-inside: avoid; max-width: 100%; overflow-x: auto; }
:is(#report, #ownrep) .verdict { margin-top: 16px; font-weight: 700; font-size: 13px; }
.rtools { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end; align-items: center; max-width: 980px; margin: 0 auto 8px; }
.rtools .hint { margin: 0 auto 0 0; max-width: 520px; }
.btn { border: 1px solid var(--line); background: var(--panel); padding: 6px 12px; border-radius: 4px; cursor: pointer; color: var(--ink); }
.btn:hover { background: var(--acc2); border-color: var(--addln); }
.btn.pri { background: var(--acc); color: var(--onacc); border-color: var(--acc); }
.btn.pri:hover { background: var(--acc3); border-color: var(--acc3); color: var(--panel); }
.btn.dng { color: var(--fail); }
.btn.dng:hover { background: var(--failbg); border-color: var(--errln); }
.btn:disabled { opacity: .5; cursor: default; }

/* ---------- okna dialogowe */
#modal { position: fixed; inset: 0; background: var(--scrim); display: none; align-items: center; justify-content: center; z-index: 100; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-bottom, 0px)); }
#modal .dlg { background: var(--panel); color: var(--ink); border-radius: 8px; padding: 20px 24px; width: 100%; max-width: 640px; max-height: 85vh; overflow: auto; box-shadow: 0 16px 50px var(--shadow); }
#modal .dlg.sm { max-width: 420px; }

/* ------------------------------------------------ zakotwienia i zakłady */

/* ----------------------------------------------- strzemiona i zestawienie stali */

/* ======================================================================

    const ycG = gd.depth / 2;

    D.Ic = gd.I;
    D.is = lay.As > 0 ? Math.sqrt(D.Is / lay.As) : 0;
    D.dEff = gd.depth / 2 + D.is;

function find(ref) {

        s += tx(ox, oy + bh + 40, `c_nom = ${c} mm · ${lay.n}⌀${lay.dmax}${lay.dmin !== lay.dmax ? '/' + lay.dmin : ''} · strz. ⌀${dt}`, { fs: 10.5, c: C.acc, a: 'start' });

/* ---------------------------------------------- odkształcenia i naprężenia (SGN) */
D.strainSVG = function (R, dir, sec, o) {
  o = o || {};

  const r = U.MRdX(sec.N, sec.sg || 1); if (!r) return '';
  const W = o.W || 300, H = o.H || 300, mt = 30, mb = 34, hh = H - mt - mb, k = hh / gd.depth;
  const flip = (sec.sg || 1) < 0;
  const yOf = y => mt + (flip ? gd.depth - y : y) * k;
  let s = svgOpen(W, H);
  // przekrój (bok)
  const sw = Math.min(70, gd.width * k);
  s += `<rect x="10" y="${mt}" width="${sw}" height="${hh}" fill="${C.conc}" stroke="${C.concL}"/>`;
  (r.bs || []).forEach(b => { s += `<circle cx="${10 + sw / 2}" cy="${yOf(b.y)}" r="3" fill="${C.bar}"/>`; });
  // odkształcenia
  const x0 = sw + 60, ew = 70, emax = Math.max(Math.abs(r.eT), Math.abs(r.eB), 1e-6);
  const ex = e => x0 + e / emax * ew * 0.5;
  s += `<line x1="${x0}" y1="${mt}" x2="${x0}" y2="${mt + hh}" stroke="${C.ink2}"/>`;
  const yT = flip ? mt + hh : mt, yB = flip ? mt : mt + hh;
  s += `<polygon points="${x0},${yT} ${ex(r.eT)},${yT} ${ex(r.eB)},${yB} ${x0},${yB}" fill="${C.acc}" fill-opacity="0.12" stroke="${C.acc}"/>`;
  s += tx(ex(r.eT) + (r.eT >= 0 ? 4 : -4), yT + (flip ? 12 : -4), fmt(r.eT * 1000, 2) + '‰', { fs: 9.5, c: C.acc, a: r.eT >= 0 ? 'start' : 'end' }) + tx(ex(r.eB) + (r.eB >= 0 ? 4 : -4), yB + (flip ? -4 : 12), fmt(r.eB * 1000, 2) + '‰', { fs: 9.5, c: C.acc, a: r.eB >= 0 ? 'start' : 'end' });
  s += tx(x0, 14, 'ε [‰]', { fs: 10.5, w: 600 });
  // naprężenia w betonie (strefa ściskana)
  const x1 = x0 + ew + 50;
  s += `<line x1="${x1}" y1="${mt}" x2="${x1}" y2="${mt + hh}" stroke="${C.ink2}"/>` + tx(x1 + 20, 14, 'σ_c', { fs: 10.5, w: 600 });
  if (r.x !== null && r.x > 0) {
    const xc = Math.min(r.x === Infinity ? gd.depth : r.x, gd.depth), a = xc * k, sw2 = 40;
    const yA = flip ? mt + hh : mt, dirY = flip ? -1 : 1;
    if (m.diag === 'rect') { const aa = Math.min(m.lambda * xc, gd.depth) * k; s += `<rect x="${x1}" y="${flip ? yA - aa : yA}" width="${sw2}" height="${aa}" fill="${C.red}" fill-opacity="0.15" stroke="${C.red}"/>`; }
    else {
      const pts = []; for (let i = 0; i <= 24; i++) { const t = i / 24, yy = t * xc; const e = r.eT + (r.eB - r.eT) * (flip ? (gd.depth - yy) : yy) / gd.depth; const ec = flip ? r.eB + (r.eT - r.eB) * yy / gd.depth : e; const sg = ec <= 0 ? 0 : ec >= m.ec2 ? 1 : 1 - Math.pow(1 - ec / m.ec2, m.npar); pts.push([x1 + sg * sw2, yA + dirY * yy * k]); }
      s += `<polygon points="${x1},${yA} ${pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ')} ${x1},${yA + dirY * a}" fill="${C.red}" fill-opacity="0.15" stroke="${C.red}"/>`;
    }
    if (r.x !== Infinity && r.x < gd.depth) { const yx = yA + dirY * a; s += `<line x1="${8}" y1="${yx}" x2="${x1 + 50}" y2="${yx}" stroke="${C.red}" stroke-dasharray="4 3"/>` + tx(x1 + 52, yx + 3.5, `x = ${fmt(r.x, 0)}`, { fs: 9.5, c: C.red, a: 'start' }); }
  }
  const smax = Math.max(...(r.bs || []).map(b => -b.s), 0), cmax = Math.max(...(r.bs || []).map(b => b.s), 0);
  s += tx(10, H - 16, `N = ${fmt(sec.N / 1e3, 1)} kN, M_Rd = ${fmt(Math.abs(r.M) / 1e6, 1)} kNm`, { fs: 10, a: 'start', c: C.ink2 });
  s += tx(10, H - 3, `σ_s: rozc. ${fmt(smax, 0)} MPa, ścisk. ${fmt(cmax, 0)} MPa`, { fs: 10, a: 'start', c: C.ink2 });
  return s + '</svg>';
};

/* ------------------------------------------------------------ schemat słupa */
// dir: 'y' (płaszczyzna h) | 'z' (płaszczyzna b); o: {W, H, diag: 'M'|'N'|'none', combo, click}
D.schemeSVG = function (R, S, dir, o) {
  o = o || {};
  const g = R.g, B = R.buck[dir], sch = B.sch;
  const W = o.W || 300, H = o.H || 440;
  const mt = 96, mb = 54, cx = W * 0.44, hh = H - mt - mb;
  const depth = g.dir[dir].depth, cw = Math.max(14, Math.min(34, depth / 25));
  const Y = xi => mt + (1 - xi) * hh;                 // ξ = 0 – podstawa
  let s = svgOpen(W, H, `class="schemesvg" data-dir="${dir}"`);
  s += tx(8, 16, dir === 'y' ? 'Płaszczyzna h – zginanie M_y' : 'Płaszczyzna b – zginanie M_z', { fs: 11.5, w: 650, a: 'start' });
  s += tx(8, 30, `${B.schName.replace(/ \(.*\)/, '')}${B.braced ? '' : ''}`, { fs: 9.5, a: 'start', c: C.ink2 });
  // słup
  s += `<rect x="${cx - cw / 2}" y="${Y(1)}" width="${cw}" height="${hh}" fill="${C.conc}" stroke="${C.concL}" stroke-width="1.2" data-sch="${dir}" class="schcol"/>`;
  // podpory
  const hatch = (x, y, w, up) => { let p = `<line x1="${x - w / 2}" y1="${y}" x2="${x + w / 2}" y2="${y}" stroke="${C.ink}" stroke-width="1.6"/>`; for (let i = 0; i <= 6; i++) { const xx = x - w / 2 + i * w / 6; p += `<line x1="${xx}" y1="${y}" x2="${xx - 6}" y2="${y + (up ? -7 : 7)}" stroke="${C.gnd}" stroke-width="0.9"/>`; } return p; };
  const fixedBot = ['cant', 'fp', 'ff', 'ffs'].includes(sch), pinBot = sch === 'pp';

  if (pinBot) sup += `<path d="M${cx},${Y(0)} l-9,13 h18 z" fill="#ffffff" stroke="${C.ink}" stroke-width="1.3"/>` + hatch(cx, Y(0) + 13, 30, false);
  if (sch === 'pp' || sch === 'fp') sup += `<path d="M${cx},${Y(1)} l-9,-13 h18 z" fill="#ffffff" stroke="${C.ink}" stroke-width="1.3"/><line x1="${cx - 12}" y1="${Y(1) - 13}" x2="${cx + 12}" y2="${Y(1) - 13}" stroke="${C.ink}" stroke-width="1.6"/>` + tx(cx + 16, Y(1) - 6, 'przegub nieprzesuwny', { fs: 8.5, a: 'start', c: C.mut });
  if (sch === 'ff') sup += hatch(cx, Y(1), cw + 26, true);

  if (sch === 'cant') sup += tx(cx + 14, Y(1) - 4, 'swobodny', { fs: 8.5, a: 'start', c: C.mut });
  s += `<g class="supp" data-sch="${dir}" style="cursor:pointer">${sup}<rect x="${cx - 40}" y="${Y(1) - 22}" width="80" height="22" fill="transparent"/><rect x="${cx - 40}" y="${Y(0)}" width="80" height="22" fill="transparent"/></g>`;
  // kombinacja do pokazania
  const res = R.res || [];
  const oc = o.combo !== undefined && res[o.combo] ? res[o.combo] : (res.length ? res.reduce((a, q) => (q[dir].u > a[dir].u ? q : a)) : null);

    s += `<g stroke="${C.vio}" fill="${C.vio}"><line x1="${cx}" y1="${tipY - 34}" x2="${cx}" y2="${tipY}" stroke-width="1.8"/><path d="M${cx - 4},${tipY - 8} l4,8 l4,-8z"/></g>` + tx(cx - 6, tipY - 24, `N_Ed = ${fmt(NT / 1e3, 0)} kN`, { fs: 10, c: C.vio, a: 'end', w: 600 });
    // poziome: siły skupione w głowicy i obciążenie rozłożone (suma wkładów pozycji)
    let H0 = 0, q0 = 0;
    (R.items || []).forEach((it, i) => { const f = oc.c.f[i]; if (!f || it.kind === 'sw') return; H0 += f * (dir === 'y' ? it.Hh || 0 : it.Hb || 0); q0 += f * (dir === 'y' ? it.qh || 0 : it.qb || 0); });
    if (Math.abs(H0) > 1e-6) { const sg = H0 > 0 ? 1 : -1, xa = cx + sg * (cw / 2 + 4); s += `<g stroke="${C.acc}" fill="${C.acc}"><line x1="${xa + sg * 34}" y1="${Y(1) + 8}" x2="${xa}" y2="${Y(1) + 8}" stroke-width="1.6"/><path d="M${xa},${Y(1) + 8} l${-sg * 8},-4 v8z"/></g>` + tx(xa + sg * 36, Y(1) + 4, `H = ${fmt(Math.abs(H0), 1)} kN`, { fs: 9.5, c: C.acc, a: sg > 0 ? 'start' : 'end' }); }
    if (Math.abs(q0) > 1e-6) { const sg = q0 > 0 ? 1 : -1; let qq = ''; for (let i = 1; i < 8; i++) { const y = Y(i / 8), xa = cx - sg * (cw / 2 + 2); qq += `<line x1="${xa - sg * 18}" y1="${y}" x2="${xa}" y2="${y}"/><path d="M${xa},${y} l${-sg * 5},-2.5 v5z"/>`; } s += `<g stroke="${C.acc}" fill="${C.acc}" stroke-width="1">${qq}<line x1="${cx - sg * (cw / 2 + 20)}" y1="${Y(7 / 8)}" x2="${cx - sg * (cw / 2 + 20)}" y2="${Y(1 / 8)}"/></g>` + tx(cx - sg * (cw / 2 + 20), Y(7 / 8) - 8, `q = ${fmt(Math.abs(q0), 2)} kN/m`, { fs: 9.5, c: C.acc, a: sg > 0 ? 'end' : 'start' }); }
    // wykres

      const sc = (W - cx - 40) / mx * 0.9;
      const X = v => cx + v * sc;
      const ptsT = tot.map((v, i) => `${X(v).toFixed(1)},${Y(i / n).toFixed(1)}`).join(' ');
      const pts0 = vals.map((v, i) => `${X(v).toFixed(1)},${Y(i / n).toFixed(1)}`).join(' ');
      s += `<polygon points="${cx},${Y(0)} ${ptsT} ${cx},${Y(1)}" fill="${C.red}" fill-opacity="0.12" stroke="none"/>`;
      s += `<polyline points="${ptsT}" fill="none" stroke="${C.red}" stroke-width="1.6"/><polyline points="${pts0}" fill="none" stroke="${C.acc}" stroke-width="1.3" stroke-dasharray="5 3"/>`;
      // opisy: podstawa, środek, głowica (wartości obliczeniowe z przekrojów)
      r.secs.forEach(sc2 => { const y = Y(sc2.xi), v = tot[Math.round(sc2.xi * n)]; s += `<circle cx="${X(v)}" cy="${y}" r="2.6" fill="${C.red}"/>` + tx(Math.min(W - 4, X(v) + (v >= 0 ? 5 : -5)), y + (sc2.key === 'top' ? 12 : sc2.key === 'base' ? -5 : 4), fmt(sc2.M / 1e6, 1), { fs: 9.5, c: C.red, a: v >= 0 ? 'start' : 'end', w: 600 }); });

    } else if (mode === 'N') {
      const mx = Math.max(Math.abs(fr.Nbot), 1), sc = (W - cx - 40) / mx * 0.8;
      s += `<polygon points="${cx},${Y(0)} ${cx + fr.Nbot * sc},${Y(0)} ${cx + fr.Ntop * sc},${Y(1)} ${cx},${Y(1)}" fill="${C.vio}" fill-opacity="0.12" stroke="${C.vio}"/>` + tx(cx + fr.Nbot * sc + 4, Y(0) - 4, fmt(fr.Nbot / 1e3, 0), { fs: 9.5, c: C.vio, a: 'start' }) + tx(cx + fr.Ntop * sc + 4, Y(1) + 12, fmt(fr.Ntop / 1e3, 0), { fs: 9.5, c: C.vio, a: 'start' });
      s += tx(8, H - 27, 'N_Ed [kN] – z ciężarem własnym', { fs: 9.5, a: 'start', c: C.ink2 });
    } else if (mode === 'buck') {

      for (let i = 0; i <= n; i++) { const xi = i / n; let v = sch === 'cant' ? 1 - Math.cos(Math.PI * xi / 2) : sch === 'ffs' ? (1 - Math.cos(Math.PI * xi)) / 2 : window.EC2.m2Shape(sch, true, xi); p += `${(cx - cw / 2 - 8 - v * amp).toFixed(1)},${Y(xi).toFixed(1)} `; }

      s += tx(8, H - 27, `postać wyboczenia (poglądowo), β = ${fmt(B.beta, 2)}`, { fs: 9.5, a: 'start', c: C.ink2 });
    }
    s += tx(8, H - 12, `${(oc.c.name || '').slice(0, 52)}`, { fs: 9, a: 'start', c: C.mut });
  }
  // wymiary
  s += dimV(cx - cw / 2 - 46, Y(1), Y(0), `L = ${fmt(g.L / 1000, 2)} m`, { fs: 10 });
  s += tx(W - 6, 16, `l₀ = ${fmt(B.l0 / 1000, 2)} m`, { fs: 10.5, a: 'end', w: 600, c: C.warn }) + tx(W - 6, 30, `λ = ${fmt(B.lam, 1)}`, { fs: 10, a: 'end', c: C.ink2 });

};

/* ------------------------------------------------------- wykres xy (interakcja) */
// o: {W, H, title, xl, yl, curves:[{pts:[[x,y]], c, fill, dash, l}], points:[{x,y,c,r,l,gov}], sym:true}
D.xyChart = function (o) {

  (o.points || []).forEach(p => { xs.push(p.x); ys.push(p.y); });

  niceTicks(ymin, ymax, 7).forEach(t => { s += `<line x1="${ml}" y1="${Y(t)}" x2="${W - mr}" y2="${Y(t)}" stroke="${C.grid}"/>` + tx(ml - 5, Y(t) + 3.5, fmt(t, 0), { fs: 9.5, c: C.mut, a: 'end' }); });
  niceTicks(xmin, xmax, 7).forEach(t => { s += `<line x1="${X(t)}" y1="${mt}" x2="${X(t)}" y2="${H - mb}" stroke="${C.grid2}"/>` + tx(X(t), H - mb + 13, fmt(t, 0), { fs: 9.5, c: C.mut }); });
  s += `<line x1="${ml}" y1="${Y(0)}" x2="${W - mr}" y2="${Y(0)}" stroke="${C.concL}"/><line x1="${X(0)}" y1="${mt}" x2="${X(0)}" y2="${H - mb}" stroke="${C.concL}"/>`;
  s += tx((ml + W - mr) / 2, H - 6, o.xl || '', { fs: 10.5, c: C.ink2 }) + tx(13, (mt + H - mb) / 2, o.yl || '', { fs: 10.5, c: C.ink2, rot: -90 });
  (o.curves || []).forEach(c => {
    const pts = c.pts.map(p => `${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(' ');
    s += c.fill ? `<polygon points="${pts}" fill="${c.fill}" fill-opacity="${c.fo || 0.08}" stroke="${c.c}" stroke-width="${c.w || 1.6}" ${c.dash ? `stroke-dasharray="${c.dash}"` : ''}/>` : `<polyline points="${pts}" fill="none" stroke="${c.c}" stroke-width="${c.w || 1.6}" ${c.dash ? `stroke-dasharray="${c.dash}"` : ''}/>`;
  });
  (o.points || []).forEach(p => { s += `<circle cx="${X(p.x).toFixed(1)}" cy="${Y(p.y).toFixed(1)}" r="${p.r || 2.6}" fill="${p.c || C.acc}" ${p.gov ? `stroke="#ffffff" stroke-width="1"` : 'fill-opacity="0.75"'} ${p.ci !== undefined ? `data-ci="${p.ci}" style="cursor:pointer"` : ''}><title>${esc(p.t || '')}</title></circle>`; if (p.l) s += tx(X(p.x) + 6, Y(p.y) - 6, p.l, { fs: 9.5, c: p.c || C.acc, a: 'start', w: 600 }); });
  // legenda
  let ly = mt + 4; (o.legend || []).forEach(l => { s += `<line x1="${W - mr - 150}" y1="${ly}" x2="${W - mr - 134}" y2="${ly}" stroke="${l.c}" stroke-width="2" ${l.dash ? `stroke-dasharray="${l.dash}"` : ''}/>` + (l.dot ? `<circle cx="${W - mr - 142}" cy="${ly}" r="3" fill="${l.c}"/>` : '') + tx(W - mr - 130, ly + 3.5, l.l, { fs: 9.5, a: 'start', c: C.ink2 }); ly += 13; });
  return s + '</svg>';
};
// krzywa interakcji N–M w kierunku (zamknięta: M > 0 i M < 0)
D.interactionSVG = function (R, dir, o) {

    legend: [{ c: C.ok, l: 'nośność N_Rd – M_Rd' }, { c: C.acc, l: 'kombinacje (M_Ed z II rz.)', dot: true }, { c: C.red, l: 'kombinacja decydująca', dot: true }] });
};
// kontur M_y – M_z przy N (metoda włókien)
D.contourSVG = function (R, N, pts, o) {

  return D.xyChart({ W: o.W || 400, H: o.H || 400, title: o.title || `Kontur nośności M_z – M_y przy N = ${fmt(N / 1e3, 0)} kN`, xl: 'M_z [kNm]', yl: 'M_y [kNm]', curves: [{ pts: loop, c: C.ok, fill: C.ok, fo: 0.07 }], points: pts, sym: true, symY: true,
    legend: [{ c: C.ok, l: 'kontur M_Rd (włókna)' }, { c: C.red, l: 'M_Ed (decydujące)', dot: true }] });
};

/* -------------------------------------------- wykres wartości na wysokości słupa */
// o: {W, H, L (mm), series:[{v: Float64Array/[] (ξ = i/n), c, l, dash, fill}], title, unit, marks}
D.heightChart = function (o) {
  const W = o.W || 260, H = o.H || 380, ml = 40, mr = 16, mt = 42, mb = 38;
  const all = o.series.flatMap(s => Array.from(s.v)).concat([0]);
  let vmin = Math.min(...all), vmax = Math.max(...all); if (vmax - vmin < 1e-9) { vmax += 1; vmin -= 1; }
  const pad = (vmax - vmin) * 0.12; vmin -= pad; vmax += pad;
  const X = v => ml + (v - vmin) / (vmax - vmin) * (W - ml - mr), Y = xi => mt + (1 - xi) * (H - mt - mb);
  let s = svgOpen(W, H, 'class="hchart"');
  s += tx(6, 14, o.title || '', { fs: 11.5, w: 650, a: 'start' });
  niceTicks(vmin, vmax, 5).forEach(t => { s += `<line x1="${X(t)}" y1="${mt}" x2="${X(t)}" y2="${H - mb}" stroke="${C.grid}"/>` + tx(X(t), H - mb + 13, fmt(t, Math.abs(vmax - vmin) < 10 ? 1 : 0), { fs: 9.5, c: C.mut }); });
  const L = (o.L || 1000) / 1000;
  niceTicks(0, L, 5).forEach(t => { const y = Y(t / L); s += `<line x1="${ml}" y1="${y}" x2="${W - mr}" y2="${y}" stroke="${C.grid2}"/>` + tx(ml - 4, y + 3.5, fmt(t, 1), { fs: 9.5, c: C.mut, a: 'end' }); });
  s += `<line x1="${X(0)}" y1="${mt}" x2="${X(0)}" y2="${H - mb}" stroke="${C.concL}" stroke-width="1.2"/>`;
  s += tx((ml + W - mr) / 2, H - 6, o.unit || '', { fs: 10, c: C.ink2 }) + tx(11, (mt + H - mb) / 2, 'x [m] od podstawy', { fs: 9.5, c: C.ink2, rot: -90 });
  o.series.forEach(se => {
    const v = Array.from(se.v), n = v.length - 1;
    const pts = v.map((y, i) => `${X(y).toFixed(1)},${Y(i / n).toFixed(1)}`).join(' ');
    if (se.fill) s += `<polygon points="${X(0)},${Y(0)} ${pts} ${X(0)},${Y(1)}" fill="${se.fill}" fill-opacity="0.12"/>`;
    s += `<polyline points="${pts}" fill="none" stroke="${se.c}" stroke-width="${se.w || 1.6}" ${se.dash ? `stroke-dasharray="${se.dash}"` : ''}/>`;
  });
  (o.marks || []).forEach(mk => { s += `<circle cx="${X(mk.v)}" cy="${Y(mk.xi)}" r="2.8" fill="${mk.c}"/>` + tx(X(mk.v) + (mk.v >= 0 ? 5 : -5), Y(mk.xi) + (mk.xi > 0.9 ? 12 : mk.xi < 0.1 ? -4 : 4), mk.l, { fs: 9.5, c: mk.c, a: mk.v >= 0 ? 'start' : 'end', w: 600 }); });
  let lx = 6; const ly = 28;
  o.series.filter(se => se.l).forEach(se => { s += `<line x1="${lx}" y1="${ly}" x2="${lx + 14}" y2="${ly}" stroke="${se.c}" stroke-width="2" ${se.dash ? `stroke-dasharray="${se.dash}"` : ''}/>` + tx(lx + 17, ly + 3.5, se.l, { fs: 9, a: 'start', c: C.ink2 }); lx += se.l.length * 5.2 + 30; });
  return s + '</svg>';
};
// rozkłady momentów kombinacji w kierunku: M0, M0 + e_i·N, M_Ed (z II rzędem)
D.momentSeries = function (R, oc, dir) {
  const r = oc[dir], fr = oc.fr, B = R.buck[dir], E = window.EC2;
  const M0 = Array.from(fr[dir].M), n = M0.length - 1;
  const M2 = isFinite(r.M2) ? r.M2 : 0;
  const sgn = v => (r.braced ? (r.tr ? r.sg : r.sEnd) : (v !== 0 ? Math.sign(v) : r.sg)) || 1;
  const imp = M0.map((v, i) => v + sgn(v) * Math.max(0, fr.Nat(i / n)) * r.ei);
  const tot = M0.map((v, i) => { const xi = i / n; const sh = r.braced ? E.m2Shape(B.sch, true, xi) : E.m2Shape(B.sch, false, xi); return imp[i] + sgn(v) * M2 * sh; });
  return { M0: M0.map(v => v / 1e6), imp: imp.map(v => v / 1e6), tot: tot.map(v => v / 1e6) };
};

/* --------------------------------------------------------- rysunek zbrojenia słupa */
D.elevationSVG = function (R, S, o) {
  o = o || {};
  const g = R.g, lay = R.lay, sch = R.sched, T = R.ties, A = R.anch, cov = R.cov;
  if (!lay.n || !sch) return '';
  const det = S.det, L = g.L, hTop = det.hTop, found = det.base === 'found', cont = det.top === 'cont';
  const zTop = L + hTop + (cont ? A.l0 : 0), zBot = found ? -det.hF : -Math.min(400, A.l0 * 0.4);
  const span = zTop - zBot;
  const H = o.H || 720, W = o.W || 560, mt = 30, mb = 40;
  const k = (H - mt - mb) / span;
  const depth = g.dir.y.depth, wcol = Math.max(40, Math.min(150, depth * k * 1.0));
  const kx = wcol / depth;
  const cx = 210;
  const Y = z => H - mb - (z - zBot) * k, X = x => cx - wcol / 2 + x * kx;
  let s = svgOpen(W, H, 'class="elevsvg"');
  // fundament / słup niższy
  if (found) { const fw = wcol + 160; s += `<rect x="${cx - fw / 2}" y="${Y(0)}" width="${fw}" height="${Y(zBot) - Y(0)}" fill="${C.conc}" stroke="${C.concL}"/>` + tx(cx + fw / 2 - 4, Y(zBot) - 6, `fundament h_F = ${det.hF}`, { fs: 9.5, a: 'end', c: C.mut }); }
  else { s += `<rect x="${X(0)}" y="${Y(0)}" width="${wcol}" height="${Y(zBot) - Y(0)}" fill="${C.conc}" stroke="${C.concL}" stroke-dasharray="5 3"/>` + `<rect x="${cx - wcol / 2 - 70}" y="${Y(0) - 0}" width="${wcol + 140}" height="${Math.max(6, 200 * k)}" fill="${C.conc}" stroke="${C.concL}" transform="translate(0,${-Math.max(6, 200 * k)})" opacity="0"/>` + tx(cx, Y(zBot) - 4, 'słup kondygnacji niższej', { fs: 9.5, c: C.mut }); }
  // słup
  s += `<rect x="${X(0)}" y="${Y(L)}" width="${wcol}" height="${Y(0) - Y(L)}" fill="${C.conc}" stroke="${C.concL}" stroke-width="1.2"/>`;
  // strop / belka u góry
  const sw = wcol + 180;
  s += `<rect x="${cx - sw / 2}" y="${Y(L + hTop)}" width="${sw}" height="${Y(L) - Y(L + hTop)}" fill="${C.conc}" stroke="${C.concL}"/>` + tx(cx + sw / 2 - 4, Y(L + hTop) - 4, `strop / belka h = ${hTop}`, { fs: 9.5, a: 'end', c: C.mut });
  if (cont) s += `<rect x="${X(0)}" y="${Y(zTop)}" width="${wcol}" height="${Y(L + hTop) - Y(zTop)}" fill="none" stroke="${C.concL}" stroke-dasharray="5 3"/>` + tx(cx, Y(zTop) - 4, 'słup kondygnacji wyższej', { fs: 9.5, c: C.mut });
  // pręty: dwa skrajne w widoku (lewy/prawy)
  const xb = [lay.offC || lay.a, depth - (lay.offC || lay.a)];
  const main = sch.rows.find(r => r.kind === 'main'), start = sch.rows.find(r => r.kind === 'start');
  xb.forEach((xx, i) => {
    const x = X(xx);
    const zEnd = cont ? zTop : L + hTop - cov.cnom - lay.dt - main.d;
    s += `<line x1="${x}" y1="${Y(0)}" x2="${x}" y2="${Y(zEnd)}" stroke="${C.bar}" stroke-width="2.2"/>`;
    if (!cont) { const leg = main.leg * kx * 0.6, sg = i === 0 ? 1 : -1; s += `<line x1="${x}" y1="${Y(zEnd)}" x2="${x + sg * Math.max(14, leg)}" y2="${Y(zEnd)}" stroke="${C.bar}" stroke-width="2.2"/>`; }
    // pręty startowe / z niższej kondygnacji (przesunięte do wnętrza)
    const xs = x + (i === 0 ? 4 : -4);
    if (found && start) { const zb = -(det.hF - det.cF - 20), sg = i === 0 ? -1 : 1; s += `<polyline points="${xs + sg * Math.max(16, start.leg * kx * 0.6)},${Y(zb)} ${xs},${Y(zb)} ${xs},${Y(A.l0)}" fill="none" stroke="${C.acc}" stroke-width="2"/>`; }
    else s += `<line x1="${xs}" y1="${Y(zBot)}" x2="${xs}" y2="${Y(A.l0)}" stroke="${C.mut}" stroke-width="2" stroke-dasharray="6 3"/>`;
  });
  // strzemiona
  T.pos.forEach(z => { s += `<line x1="${X(0) + 3}" y1="${Y(z)}" x2="${X(depth) - 3}" y2="${Y(z)}" stroke="${C.tie}" stroke-width="1.2"/>`; });
  // wymiary – lewa strona
  const xl = cx - wcol / 2 - 70;
  s += dimV(xl, Y(L), Y(0), `L = ${fmt(L, 0)}`);
  s += dimV(xl, Y(L + hTop), Y(L), `${hTop}`, { fs: 9.5 });
  s += dimV(xl - 26, Y(A.l0), Y(0), `l₀ = ${fmt(A.l0, 0)}`, { fs: 9.5 });
  if (cont) s += dimV(xl - 26, Y(zTop), Y(L + hTop), `l₀ = ${fmt(A.l0, 0)}`, { fs: 9.5 });
  if (found) s += dimV(xl, Y(0), Y(-(det.hF - det.cF - 20)), `${fmt(det.hF - det.cF - 20, 0)}`, { fs: 9.5 });
  // strefy strzemion – prawa strona
  const xr = cx + wcol / 2 + 18;
  const zones = [[50, T.zBot, T.sRed], [T.zBot, L - T.zTop, T.s], [L - T.zTop, L - 50, T.sRed]].filter(q => q[1] - q[0] > 1);
  zones.forEach(([a, b, sp]) => { const n = Math.round((b - a) / sp); s += dimV(xr, Y(b), Y(a), '', {}) + tx(xr + 6, (Y(a) + Y(b)) / 2 + 3.5, `${fmt(b - a, 0)}: ⌀${lay.dt} co ${fmt(sp, 0)}`, { fs: 9.5, a: 'start', c: sp < T.s ? C.tie : C.dim }); });
  // odnośniki pozycji
  const lab = (n, txt, x, y, xt) => `<line x1="${x}" y1="${y}" x2="${xt}" y2="${y}" stroke="${C.ink2}" stroke-width="0.8"/><circle cx="${xt + 9}" cy="${y}" r="8" fill="#ffffff" stroke="${C.ink}"/>` + tx(xt + 9, y + 3.5, String(n), { fs: 9.5, w: 700 }) + tx(xt + 21, y + 3.5, txt, { fs: 9.5, a: 'start' });
  const xLab = W - 190;
  s += lab(main.pos, `${main.n}⌀${main.d} l = ${fmt(main.len, 0)}`, X(xb[1]), Y(L * 0.62), xLab);
  if (start) s += lab(start.pos, `${start.n}⌀${start.d} l = ${fmt(start.len, 0)}`, X(xb[1]) - 4, Y(A.l0 * 0.5), xLab);
  const tie = sch.rows.find(r => r.kind === 'tie');
  s += lab(tie.pos, `${tie.n} szt. ⌀${tie.d} l = ${fmt(tie.len, 0)}`, X(depth * 0.5), Y(L * 0.42 - (T.pos.length ? 0 : 0)), xLab);
  const pins = sch.rows.filter(r => r.kind === 'pin');
  pins.forEach((p, i) => { s += lab(p.pos, `${p.n} szt. ⌀${p.d} l = ${fmt(p.len, 0)}`, X(depth * 0.3), Y(L * (0.32 - i * 0.07)), xLab); });
  // przekrój A–A
  const za = L * 0.5;
  s += `<g stroke="${C.ink}" stroke-width="1.2"><line x1="${X(0) - 18}" y1="${Y(za)}" x2="${X(0) - 4}" y2="${Y(za)}"/><line x1="${X(depth) + 4}" y1="${Y(za)}" x2="${X(depth) + 18}" y2="${Y(za)}"/></g>` + tx(X(0) - 22, Y(za) + 4, 'A', { fs: 11, w: 700, a: 'end' }) + tx(X(depth) + 22, Y(za) + 4, 'A', { fs: 11, w: 700, a: 'start' });
  s += tx(8, 16, 'Widok słupa – płaszczyzna h (rysunek poglądowy, wymiary w mm)', { fs: 11, w: 650, a: 'start' });
  return s + '</svg>';
};
// wyciągi prętów (kształty z wymiarami, bez skali)
D.extractsSVG = function (R, S, o) {
  o = o || {};
  const sch = R.sched; if (!sch) return '';
  const W = o.W || 760, rowH = 64, H = 20 + sch.rows.length * rowH;
  let s = svgOpen(W, H, 'class="extsvg"');
  sch.rows.forEach((r, i) => {
    const y = 20 + i * rowH + 30, x0 = 120, x1 = W - 170;
    s += `<circle cx="20" cy="${y - 6}" r="9" fill="#ffffff" stroke="${C.ink}"/>` + tx(20, y - 2.5, String(r.pos), { fs: 10, w: 700 }) + tx(34, y - 2, `${r.n}×⌀${r.d}`, { fs: 10.5, w: 650, a: 'start' }) + tx(34, y + 11, r.name.slice(0, 18), { fs: 8.5, a: 'start', c: C.mut });
    const col = r.kind === 'tie' || r.kind === 'pin' ? C.tie : r.kind === 'start' ? C.acc : C.bar;
    if (r.shape === 'I') s += `<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="${col}" stroke-width="2.4"/>` + tx((x0 + x1) / 2, y - 6, fmt(r.straight, 0), { fs: 10 });
    else if (r.shape === 'L') { const lg = Math.max(20, Math.min(60, r.leg / r.len * (x1 - x0) * 2)); s += `<polyline points="${x0},${y - lg} ${x0},${y} ${x1},${y}" fill="none" stroke="${col}" stroke-width="2.4"/>` + tx((x0 + x1) / 2, y - 6, fmt(r.straight, 0), { fs: 10 }) + tx(x0 - 6, y - lg / 2 + 3, fmt(r.leg, 0), { fs: 10, a: 'end' }); }
    else if (r.shape === 'S') { const g = R.g, c = R.cov.cnom, bt = g.b - 2 * c - r.d, ht = g.h - 2 * c - r.d, sc = Math.min(44 / ht, 120 / bt), w = bt * sc, h = ht * sc, xx = x0 + 30; s += `<rect x="${xx}" y="${y - h / 2 - 4}" width="${w}" height="${h}" rx="3" fill="none" stroke="${col}" stroke-width="2"/><line x1="${xx + 3}" y1="${y - h / 2 - 1}" x2="${xx + 11}" y2="${y - h / 2 + 7}" stroke="${col}" stroke-width="2"/><line x1="${xx + 1}" y1="${y - h / 2 + 3}" x2="${xx + 9}" y2="${y - h / 2 + 11}" stroke="${col}" stroke-width="2"/>` + tx(xx + w / 2, y - h / 2 - 8, fmt(bt, 0), { fs: 9.5 }) + tx(xx + w + 6, y, fmt(ht, 0), { fs: 9.5, a: 'start' }) + tx(xx + w + 60, y + 3, `haki 135°: ${fmt(r.hook, 0)} mm`, { fs: 9.5, a: 'start', c: C.mut }); }
    else if (r.shape === 'O') { s += `<circle cx="${x0 + 50}" cy="${y - 4}" r="22" fill="none" stroke="${col}" stroke-width="2"/>` + tx(x0 + 82, y, `⌀ wewn. ${fmt(R.g.D - 2 * R.cov.cnom - 2 * r.d, 0)}, haki ${fmt(r.hook, 0)}`, { fs: 9.5, a: 'start' }); }
    else if (r.shape === 'P') { s += `<polyline points="${x0 + 10},${y - 12} ${x0},${y} ${x0 + 160},${y} ${x0 + 150},${y - 12}" fill="none" stroke="${col}" stroke-width="2"/>` + tx(x0 + 80, y - 6, fmt(r.len - 2 * r.hook, 0), { fs: 9.5 }); }
    s += tx(W - 10, y + 3, `l = ${fmt(r.len, 0)} mm`, { fs: 10.5, a: 'end', w: 650 });
  });
  return s + '</svg>';
};
})();

<script>/* SłupŻB – raport obliczeniowy (notka obliczeniowa z pełnym tokiem obliczeń) */
(function () {

const PLN = d => d === 'y' ? 'h' : 'b';
const SECN = { base: 'podstawa', mid: 'strefa środkowa', top: 'głowica' };

function helpers() {
  const U = window.SZ, D = window.SZD;

  const H3 = t => `<h3>${hn}.${++h3n}. ${t}</h3>`;

  };
  const line = (t, ref) => `<div class="eq">${t}${ref ? `<span class="r">[${ref}]</span>` : ''}</div>`;

    const good = rel === '≤' ? a <= b * (1 + 1e-9) + 1e-9 : rel === '<' ? a < b : a >= b * (1 - 1e-9) - 1e-9;

  };
  const note = t => `<p class="note">${t}</p>`;
  const sec = (key, html) => `<section data-sec="${key}">${html}</section>`;
  return { U, D, fmt, sym, esc, f, H2, H3, eq, line, cmp, note, sec };
}
const govOf = (R, d) => R.res.reduce((a, q) => (q[d].u > a[d].u ? q : a));

  o += eq('f_{cd}', 'α_{cc}·f_{ck}/γ_{c}', `${f(m.acc, 2)}·${f(m.fck, 0)}/${f(m.gc, 2)}`, f(m.fcd, 2), 'MPa', '3.1.6');
  o += eq('E_{cm}', '', '', f(m.Ecm / 1000, 0), 'GPa', 'tab. 3.1') + eq('E_{cd}', 'E_{cm}/γ_{cE}', `${f(m.Ecm / 1000, 0)}/${f(m.gcE, 2)}`, f(m.Ecd / 1000, 2), 'GPa', '5.8.6(3)');
  o += line(`ε<sub>c2</sub> = ${f(m.ec2 * 1000, 2)}‰, ε<sub>cu2</sub> = ${f(m.ecu2 * 1000, 2)}‰, n = ${f(m.npar, 2)}; ε<sub>c3</sub> = ${f(m.ec3 * 1000, 2)}‰, ε<sub>cu3</sub> = ${f(m.ecu3 * 1000, 2)}‰; wykres do wymiarowania: ${m.diag === 'rect' ? 'prostokątny (λ = ' + f(m.lambda, 2) + ', η = ' + f(m.eta, 2) + ')' : 'parabola-prostokąt'}`, '3.1.7');
  o += H3(`Stal ${esc(m.st.name)}`);
  o += eq('f_{yd}', 'f_{yk}/γ_{s}', `${m.fyk}/${f(m.gs, 2)}`, f(m.fyd, 1), 'MPa', '3.2.7') + eq('ε_{yd}', 'f_{yd}/E_{s}', `${f(m.fyd, 1)}/200 000`, f(m.eyd * 1000, 3), '‰') + eq('f_{ywd}', 'f_{ywk}/γ_{s}', `${m.fywk}/${f(m.gs, 2)}`, f(m.fywd, 1), 'MPa');
  // otulina
  let c = H2('Otulina betonowa');
  c += line(`Klasa konstrukcji: ${cov.mods.map(esc).join('; ')} → <b>S${cov.sc}</b>`, 'tab. 4.3N');
  c += eq('c_{min,dur}', '', '', cov.cdur, 'mm', 'tab. 4.4N') + eq('c_{min,b}', '⌀ (pręt podłużny) / ⌀_{t} (strzemię)', `${cov.cminb_main} / ${cov.cminb_sw}`, '', 'mm', '4.4.1.2(3)');
  c += eq('c_{min}', 'max(c_{min,b}; c_{min,dur} + Δc_{dur,γ} − Δc_{dur,st} − Δc_{dur,add}; 10 mm)', '', `${cov.cmin_sw} / ${cov.cmin_main}`, 'mm (strzemię / pręt)', '4.4.1.2');
  c += eq('c_{nom}', 'max(c_{min,s} + Δc_{dev}; c_{min,pręt} + Δc_{dev} − ⌀_{t})', `max(${cov.cmin_sw} + ${cov.dcdev}; ${cov.cmin_main} + ${cov.dcdev} − ${cov.dSw})`, f(cov.req, 0), 'mm → ' + cov.reqR + ' mm', '4.4.1.1');
  c += line(`Przyjęto otulinę strzemion c<sub>nom</sub> = <b>${cov.cnom} mm</b>${cov.manual ? ' (podana ręcznie)' : ''} ${cov.cnom >= cov.reqR ? '<span class="ok">✔</span>' : '<span class="fail">✖ mniej niż wymagane</span>'}; minimalna klasa betonu: ${cov.minCls} (${cov.minFrom}) ${cov.minOk ? '<span class="ok">✔</span>' : '<span class="warn">⚠ klasa betonu niższa od zalecanej</span>'}`, 'zał. E');
  o += sec('cov', c);
  // obciążenia
  o += H2(S.loads.mode === 'direct' ? 'Siły obliczeniowe (wprowadzone)' : 'Obciążenia i kombinacje');
  if (S.loads.mode === 'direct') {
    R.items.forEach(it => { if (it.kind === 'sw') { o += line(`G₀ – ciężar własny słupa: ${f(g.selfW, 2)} kN/m × ${f(g.L / 1000, 2)} m = ${f(g.selfW * g.L / 1000, 1)} kN (w kombinacjach z γ<sub>G</sub> = ${f(S.loads.gG, 2)})`); return; }
      o += line(`<b>${esc(it.id)}</b> – ${esc(it.name)}: N<sub>Ed</sub> = ${f(it.N, 1)} kN; M<sub>y</sub>: głowica ${f(it.Myt, 2)}, podstawa ${f(it.Myb, 2)} kNm; M<sub>z</sub>: głowica ${f(it.Mzt, 2)}, podstawa ${f(it.Mzb, 2)} kNm${it.Vy !== '' ? `; V<sub>y</sub> = ${f(+it.Vy, 1)} kN` : ''}${it.Vz !== '' ? `; V<sub>z</sub> = ${f(+it.Vz, 1)} kN` : ''}`); });
    o += note(`Siły I rzędu bez imperfekcji. Do pełzania przyjęto M<sub>0Eqp</sub>/M<sub>0Ed</sub> = ${f(S.loads.rqp, 2)}, do SGU siły charakterystyczne = ${f(S.loads.rk, 2)} × obliczeniowe.`);
  } else {
    o += H3('Obciążenia charakterystyczne');
    R.items.forEach(it => {
      if (it.kind === 'sw') { o += line(`<b>G₀</b> – ciężar własny słupa: 25 kN/m³ × ${f(g.Ac / 1e6, 4)} m² = ${f(g.selfW, 2)} kN/m; u podstawy ${f(g.selfW * g.L / 1000, 1)} kN`); return; }
      const parts = [];
      if (it.N) parts.push(`N = ${f(it.N, 1)} kN`); if (it.eh) parts.push(`e<sub>h</sub> = ${f(it.eh, 0)} mm`); if (it.eb) parts.push(`e<sub>b</sub> = ${f(it.eb, 0)} mm`);
      if (it.Myt || it.Myb) parts.push(`M<sub>y</sub>: głowica ${f(it.Myt, 2)}, podstawa ${f(it.Myb, 2)} kNm`); if (it.Mzt || it.Mzb) parts.push(`M<sub>z</sub>: głowica ${f(it.Mzt, 2)}, podstawa ${f(it.Mzb, 2)} kNm`);
      if (it.Hh) parts.push(`H<sub>h</sub> = ${f(it.Hh, 2)} kN`); if (it.Hb) parts.push(`H<sub>b</sub> = ${f(it.Hb, 2)} kN`); if (it.qh) parts.push(`q<sub>h</sub> = ${f(it.qh, 2)} kN/m`); if (it.qb) parts.push(`q<sub>b</sub> = ${f(it.qb, 2)} kN/m`);
      o += line(`<b>${esc(it.id)}</b> – ${esc(it.name || '')} (${it.perm ? 'stałe' : esc(it.psi.name)}${it.pm ? ', działa w obu kierunkach ±' : ''}${it.perm ? '' : `; ψ₀ = ${f(it.psi.p0, 2)}, ψ₁ = ${f(it.psi.p1, 2)}, ψ₂ = ${f(it.psi.p2, 2)}`}): ${parts.join('; ') || 'brak wartości'}`);
    });
    o += H3('Kombinacje oddziaływań');
    o += line(S.loads.comb === '610' ? `SGN – wzór (6.10): γ<sub>G,sup</sub> = ${f(S.loads.gG, 2)}, γ<sub>G,inf</sub> = ${f(S.loads.gGinf, 2)}, γ<sub>Q</sub> = ${f(S.loads.gQ, 2)}` : `SGN – wzory (6.10a) i (6.10b): γ<sub>G,sup</sub> = ${f(S.loads.gG, 2)}, ξ = ${f(S.loads.xi, 2)}, γ<sub>G,inf</sub> = ${f(S.loads.gGinf, 2)}, γ<sub>Q</sub> = ${f(S.loads.gQ, 2)}`, 'PN-EN 1990, 6.4.3.2');
    o += line(`Liczba kombinacji SGN: ${R.combos.U.length} (każde obciążenie zmienne obecne lub nie, kolejno wiodące, obciążenia dwukierunkowe z oboma znakami, ciężar stały z γ<sub>G,sup</sub> i γ<sub>G,inf</sub>); SGU: charakterystycznych ${R.combos.K.length} (6.14b), quasi-stałych ${R.combos.QP.length} (6.16b).`);
    if (R.combos.capped) o += note('Liczba wariantów obciążeń zmiennych przekracza 729 – przyjęto wszystkie obciążenia zmienne jednocześnie (obciążenia dwukierunkowe ze znakami ±).');
  }
  if (full && R.res.length) {
    const top = R.res.slice().sort((a, b) => b.u - a.u).slice(0, 8);
    o += H3('Kombinacje decydujące (siły I rzędu)');
    top.forEach(q => { o += line(`<b>${esc(q.c.name)}</b>: ${esc(E.comboDesc(q.c, R.items))} → N<sub>Ed</sub> = ${f(q.fr.Ntop / 1e3, 1)} kN (głowica) / ${f(q.fr.Nbot / 1e3, 1)} kN (podstawa); M<sub>0y</sub>: ${f(q.y.Mt / 1e6, 2)} / ${f(q.y.Mb / 1e6, 2)} kNm; M<sub>0z</sub>: ${f(q.z.Mt / 1e6, 2)} / ${f(q.z.Mb / 1e6, 2)} kNm; η = ${isFinite(q.u) ? f(q.u * 100, 0) + '%' : '∞'}`); });
  }
  o += `<div class="fig">${['y', 'z'].map(d => D.schemeSVG(R, S, d, { W: 330, H: 440, diag: 'M' })).join('')}</div>`;
  return o;
}

SZR.build = function (R, S) {
  const h = helpers(); const { esc, f, H2, H3, eq, line, cmp, note, sec, D, U } = h, E = window.EC2;
  const g = R.g, m = R.m, lay = R.lay;
  let o = '';
  o += `<h1>${esc(S.meta.name || 'Słup')} – obliczenia statyczno-wytrzymałościowe</h1><p class="note">Słup żelbetowy wg PN-EN 1992-1-1 (z Załącznikiem Krajowym), PN-EN 1990, PN-EN 1992-1-2. Jednostki: kN, kNm, mm, MPa.</p>`;
  o += partData(R, S, h, true);
  if (!R.res.length) return o + H2('Wyniki') + line('Brak kombinacji obciążeń – dodaj obciążenia.');
  // ---- długość wyboczeniowa, imperfekcje, pełzanie
  o += H2('Długość wyboczeniowa, smukłość i imperfekcje');
  const imp = R.imp, cr = R.creep;
  ['y', 'z'].forEach(d => {
    const B = R.buck[d], gd = g.dir[d];
    let s = H3(`Płaszczyzna ${PLN(d)} (zginanie M<sub>${d}</sub>, wymiar ${gd.depth} mm)`);
    s += line(`Schemat: ${esc(B.schName)} – układ ${B.braced ? 'usztywniony (bez przesuwu głowicy)' : 'nieusztywniony (przesuwny)'}`, 'rys. 5.7');
    if (B.mode === 'k') {
      s += line(`Podatności węzłów: k₁ = ${f(B.k1in, 3)}, k₂ = ${f(B.k2in, 3)}${B.k1in < 0.1 || B.k2in < 0.1 ? ' (przyjęto k ≥ 0,1 – utwierdzenie idealne nie występuje)' : ''}`, '5.8.3.2(3)');
      s += B.braced ? eq('l_{0}', '0,5·l·√((1 + k₁/(0,45 + k₁))·(1 + k₂/(0,45 + k₂)))', '', f(B.l0, 0), 'mm', '(5.15)') : eq('l_{0}', 'l·max(√(1 + 10·k₁k₂/(k₁ + k₂)); (1 + k₁/(1 + k₁))·(1 + k₂/(1 + k₂)))', `${f(g.L, 0)}·max(${f(B.la, 3)}; ${f(B.lc, 3)})`, f(B.l0, 0), 'mm', '(5.16)');
    } else if (B.mode === 'l0') s += eq('l_{0}', '', '', f(B.l0, 0), 'mm (podana)', '5.8.3.2');
    else s += eq('l_{0}', 'β·l', `${f(B.beta, 2)}·${f(g.L, 0)}`, f(B.l0, 0), 'mm', '5.8.3.2');
    s += eq('i', '√(I_{c}/A_{c})', `√(${f(gd.I / 1e6, 1)}·10⁶/${f(g.Ac, 0)})`, f(gd.i, 1), 'mm') + eq('λ', 'l_{0}/i', `${f(B.l0, 0)}/${f(gd.i, 1)}`, f(B.lam, 1), '', '(5.14)');
    o += sec('slenB' + d, s);
  });
  o += H3('Imperfekcje geometryczne');
  if (imp.mode === 'theta') {
    o += eq('α_{h}', '2/√l', `2/√${f(g.L / 1000, 2)}`, f(imp.ah, 3), '(2/3 ≤ α_{h} ≤ 1)', '5.2(5)') + eq('α_{m}', '√(0,5·(1 + 1/m))', `m = ${imp.m}`, f(imp.am, 3), '') + eq('θ_{i}', 'θ_{0}·α_{h}·α_{m}', `(1/200)·${f(imp.ah, 3)}·${f(imp.am, 3)}`, f(imp.th, 5), 'rad', '(5.1)');
    ['y', 'z'].forEach(d => { o += eq(`e_{i,${d}}`, 'θ_{i}·l_{0}/2', `${f(imp.th, 5)}·${f(R.buck[d].l0, 0)}/2`, f(imp[d], 1), 'mm', '(5.2)'); });
  } else if (imp.mode === 'l400') ['y', 'z'].forEach(d => { o += eq(`e_{i,${d}}`, 'l_{0}/400', `${f(R.buck[d].l0, 0)}/400`, f(imp[d], 1), 'mm', '5.2(9)'); });
  else ['y', 'z'].forEach(d => { o += eq(`e_{i,${d}}`, '', '', f(imp[d], 1), 'mm (podany)', '5.2'); });
  o += note('Imperfekcje uwzględnia się jako dodatkowy mimośród siły N<sub>Ed</sub> w kierunku niekorzystnym; przy zginaniu ukośnym – tylko w jednym kierunku jednocześnie (5.8.9(2)).');
  o += H3('Pełzanie (zał. B)');
  if (cr.sel === 'auto') {
    o += eq('h_{0}', '2A_{c}/u', `2·${f(g.Ac, 0)}/${f(g.u, 0)}`, f(cr.h0, 0), 'mm');
    o += eq('φ_{RH}', m.fcm <= 35 ? '1 + (1 − RH/100)/(0,1·∛h_{0})' : '[1 + (1 − RH/100)/(0,1·∛h_{0})·α₁]·α₂', m.fcm <= 35 ? '' : `α₁ = ${f(cr.a1, 3)}, α₂ = ${f(cr.a2, 3)}`, f(cr.phiRH, 3), '', '(B.3)');
    o += eq('β(f_{cm})', '16,8/√f_{cm}', `16,8/√${f(m.fcm, 0)}`, f(cr.bfcm, 3), '', '(B.4)') + eq('β(t_{0})', '1/(0,1 + t_{0}^{0,20})', `t₀ = ${f(cr.t0adj, 1)} d`, f(cr.bt0, 3), '', '(B.5)');
    o += eq('φ(∞, t_{0})', 'φ_{RH}·β(f_{cm})·β(t_{0})', `${f(cr.phiRH, 3)}·${f(cr.bfcm, 3)}·${f(cr.bt0, 3)}`, f(cr.phi, 3), '', '(B.2)');
  } else o += line(cr.sel === 'off' ? 'Pełzanie pominięte (φ = 0).' : `Przyjęto φ(∞, t₀) = ${f(cr.phi, 2)}.`);
  o += note('Pełzanie efektywne φ<sub>ef</sub> = φ(∞, t₀)·M<sub>0Eqp</sub>/M<sub>0Ed</sub> (5.19) wyznaczono dla każdej kombinacji z momentu I rzędu kombinacji quasi-stałej o tym samym układzie obciążeń.');
  // ---- efekty II rzędu i nośność w każdej płaszczyźnie
  ['y', 'z'].forEach(d => {
    const q = govOf(R, d), r = q[d], B = R.buck[d], Dd = R.dirs[d], gd = g.dir[d];
    let s = H2(`Efekty II rzędu – płaszczyzna ${PLN(d)} (M<sub>${d}</sub>)`);
    s += line(`Kombinacja decydująca: <b>${esc(q.c.name)}</b> = ${esc(E.comboDesc(q.c, R.items))}`);
    s += eq('N_{Ed}', B.braced ? 'N w połowie wysokości' : 'N u podstawy', '', f(r.NEd / 1e3, 1), 'kN') + line(`N<sub>Ed</sub> w głowicy ${f(r.Ntop / 1e3, 1)} kN, u podstawy ${f(r.Nbot / 1e3, 1)} kN`);
    s += line(`Momenty I rzędu na końcach: głowica M = ${f(r.Mt / 1e6, 2)} kNm, podstawa M = ${f(r.Mb / 1e6, 2)} kNm${r.tr ? '; w słupie występuje obciążenie poprzeczne (rozkład nieliniowy, M<sub>max,wewn</sub> = ' + f(r.Mint / 1e6, 2) + ' kNm)' : ''}`);
    s += eq('M_{02}', '|M| większy', '', f(r.M02 / 1e6, 2), 'kNm') + eq('M_{01}', 'M mniejszy (ze znakiem względem M_{02})', '', f(r.M01 / 1e6, 2), 'kNm');
    s += eq('N_{Ed}·e_{i}', '', `${f(r.NEd / 1e3, 1)}·${f(r.ei, 1)}·10⁻³`, f(r.NEd * r.ei / 1e6, 2), 'kNm');
    if (B.braced) {
      s += eq('M_{02}', 'M_{02} + N_{Ed}·e_{i}', `${f(r.M02 / 1e6, 2)} + ${f(r.NEd * r.ei / 1e6, 2)}`, f(r.M02i / 1e6, 2), 'kNm') + eq('M_{01}', 'M_{01} + N_{Ed}·e_{i}', `${f(r.M01 / 1e6, 2)} + ${f(r.NEd * r.ei / 1e6, 2)}`, f(r.M01i / 1e6, 2), 'kNm');
      s += eq('M_{0e}', 'max(0,6·M_{02} + 0,4·M_{01}; 0,4·M_{02})', `max(0,6·${f(r.M02i / 1e6, 2)} + 0,4·${f(r.M01i / 1e6, 2)}; 0,4·${f(r.M02i / 1e6, 2)})`, f(r.M0e / 1e6, 2), 'kNm', '(5.32)');
      if (r.tr) s += eq('M_{0Ed}', 'max(M_{0e}; M_{max,wewn} + N_{Ed}·e_{i})', '', f(r.M0Ed / 1e6, 2), 'kNm');
      else s += eq('M_{0Ed}', 'M_{0e}', '', f(r.M0Ed / 1e6, 2), 'kNm');
    } else s += eq('M_{0Ed}', 'M_{0,koniec} + N_{Ed}·e_{i}', '', f(r.M0Ed / 1e6, 2), 'kNm', '5.8.8.2(1)');
    s += H3('Pełzanie efektywne i smukłość graniczna');
    if (r.M0Eqp !== undefined) s += eq('M_{0Eqp}', '(kombinacja quasi-stała, z N_{qp}·e_{i})', '', f(r.M0Eqp / 1e6, 2), 'kNm');
    s += eq('φ_{ef}', 'φ(∞,t_{0})·M_{0Eqp}/M_{0Ed}', `${f(Dd.phiInf, 3)}·${f(r.rqp, 3)}`, f(r.phiEf, 3), '', '(5.19)');
    if (r.creepIgn) s += note('Pełzanie pominięte – spełnione warunki 5.8.4(4): φ(∞,t₀) ≤ 2, λ ≤ 75, M<sub>0Ed</sub>/N<sub>Ed</sub> ≥ h.');
    s += eq('n', 'N_{Ed}/(A_{c}·f_{cd})', `${f(r.NEd, 0)}/(${f(g.Ac, 0)}·${f(m.fcd, 2)})`, f(r.n, 3), '', '5.8.3.1');
    s += eq('ω', 'A_{s}·f_{yd}/(A_{c}·f_{cd})', `${f(lay.As, 0)}·${f(m.fyd, 1)}/(${f(g.Ac, 0)}·${f(m.fcd, 2)})`, f(r.omega, 3), '');
    s += eq('A', '1/(1 + 0,2·φ_{ef})', '', f(r.A, 3), '') + eq('B', '√(1 + 2ω)', '', f(r.Bc, 3), '');
    s += r.Cmode === 'ends' ? eq('C', '1,7 − r_{m}', `r_{m} = M_{01}/M_{02} = ${f(r.rm, 3)}`, f(r.C, 3), '') : eq('C', '', { unbraced: 'układ nieusztywniony', transverse: 'obciążenie poprzeczne w słupie', imp: 'momenty I rzędu głównie od imperfekcji' }[r.Cmode], f(r.C, 2), '');
    s += eq('λ_{lim}', '20·A·B·C/√n', `20·${f(r.A, 3)}·${f(r.Bc, 3)}·${f(r.C, 3)}/√${f(r.n, 3)}`, f(r.lamLim, 1), '', '(5.13N)');
    s += line(`λ = ${f(r.lam, 1)} ${r.slender ? '&gt;' : '≤'} λ<sub>lim</sub> = ${f(r.lamLim, 1)} → ${r.slender ? '<b>efekty II rzędu należy uwzględnić</b>' : 'efekty II rzędu można pominąć (5.8.2(6))'}`, '5.8.3.1(1)');
    if (r.slender) {
      if (r.method === 'nc' || (r.method === 'gen' && !r.gen)) {
        s += H3('Metoda nominalnej krzywizny (5.8.8)');
        s += eq('i_{s}', '√(Σ A_{s,i}·(y_{i} − h/2)²/A_{s})', '', f(Dd.is, 1), 'mm') + eq('d', 'h/2 + i_{s}', `${f(gd.depth / 2, 1)} + ${f(Dd.is, 1)}`, f(r.d, 1), 'mm', '5.8.8.3(2)');
        s += eq('1/r_{0}', 'ε_{yd}/(0,45·d)', `${f(m.eyd, 5)}/(0,45·${f(r.d, 1)})`, f(r.r0 * 1e6, 3) + '·10⁻⁶', '1/mm', '5.8.8.3(1)');
        s += eq('n_{u}', '1 + ω', '', f(r.nu, 3), '') + eq('K_{r}', '(n_{u} − n)/(n_{u} − n_{bal}) ≤ 1', `(${f(r.nu, 3)} − ${f(r.n, 3)})/(${f(r.nu, 3)} − 0,4)`, f(r.Kr, 3), '', '(5.36)');
        s += eq('β', '0,35 + f_{ck}/200 − λ/150', `0,35 + ${f(m.fck, 0)}/200 − ${f(r.lam, 1)}/150`, f(r.betaPhi, 3), '') + eq('K_{φ}', '1 + β·φ_{ef} ≥ 1', `1 + ${f(r.betaPhi, 3)}·${f(r.phiEf, 3)}`, f(r.Kphi, 3), '', '(5.37)');
        s += eq('1/r', 'K_{r}·K_{φ}·1/r_{0}', `${f(r.Kr, 3)}·${f(r.Kphi, 3)}·${f(r.r0 * 1e6, 3)}·10⁻⁶`, f(r.curv * 1e6, 3) + '·10⁻⁶', '1/mm', '(5.34)');
        s += eq('e_{2}', '(1/r)·l_{0}²/c', `${f(r.curv * 1e6, 3)}·10⁻⁶·${f(r.l0, 0)}²/${f(r.c, 2)}`, f(r.e2, 1), 'mm', '5.8.8.2(4)');
        s += eq('M_{2}', 'N_{Ed}·e_{2}', `${f(r.NEd / 1e3, 1)}·${f(r.e2, 1)}·10⁻³`, f(r.M2 / 1e6, 2), 'kNm', '(5.33)');
      } else if (r.method === 'ns') {

function hintBuck() {

}

const etaOf = () => ((S.design && S.design.eta) || 100) / 100;
function applyResult(newS, msg) { const name = S.meta.name; S = E.normalize(newS); S.meta.name = name; if (COLS) COLS[curC] = S; dirty = true; renderInputs(); recalc(); updateTitle(); autosave(); if (msg) toast(msg, 5000); }
function doAutoReb() {

    const t0 = Date.now(); const r = E.autoReb(S, { eta: etaOf() });
    if (r.ok) { const c = r.cand; applyResult(r.S, `Dobrano zbrojenie (${((Date.now() - t0) / 1000).toFixed(1)} s): ${c.n}⌀${c.d}, A_s = ${fmt(c.As, 0)} mm² – wszystkie warunki spełnione.`); }

function runDesign(withReb) {
  const sizes = E.dimCandidates(S); let i = 0, stop = false; const t0 = Date.now();
  const m = $('#modal');
  m.innerHTML = `<div class="dlg sm"><h3>Dobór przekroju</h3><p id="dgMsg">Sprawdzanie przekrojów…</p><div class="prog"><i id="dgBar" style="width:0%"></i></div><div class="dbtn"><button class="btn" id="dgStop">Przerwij</button></div></div>`;
  m.style.display = 'flex'; $('#dgStop').onclick = () => { stop = true; };
  const step = () => {
    if (stop) { m.style.display = 'none'; toast('Przerwano dobór.'); return; }
    if (i >= sizes.length) { m.style.display = 'none'; toast('Nie znaleziono przekroju spełniającego warunki (do 1200 mm).', 5000); return; }
    const sz = sizes[i++];
    $('#dgMsg').textContent = `Sprawdzanie ${sz.D ? '⌀' + sz.D : sz.b + ' × ' + sz.h} mm…`; $('#dgBar').style.width = (i / sizes.length * 100) + '%';

    }

  setTimeout(step, 30);
}

    $$('[data-lk]', m).forEach(inp => inp.addEventListener('input', () => {

    }));
    $$('[data-lsel]', m).forEach(sl => sl.addEventListener('change', () => { it[sl.dataset.lsel] = sl.value; if (sl.dataset.lsel === 'kind') it.pm = sl.value === 'wind'; changed(false); draw(); }));
    $$('[data-lchk]', m).forEach(cb => cb.addEventListener('change', () => { it[cb.dataset.lchk] = cb.checked; changed(false); }));

    $('#lpDel', m).onclick = async () => { if (await ask(`Usunąć obciążenie „${esc(it.name || '')}”?`, 'Usuń', true)) { S.loads.items.splice(i, 1); changed(false); } };
  };
  draw(); m.style.display = 'flex'; popRedraw = null;
}
function ask(msg, okLabel, danger) {
  return new Promise(res => {
    const m = $('#modal');
    m.innerHTML = `<div class="dlg sm"><p>${msg}</p><div class="dbtn"><button class="btn" data-a="0">Anuluj</button><button class="btn ${danger ? 'dng' : 'pri'}" data-a="1">${okLabel}</button></div></div>`;
    m.style.display = 'flex';
    const done = v => { m.style.display = 'none'; m.onclick = null; document.removeEventListener('keydown', kd, true); res(v); };
    const kd = e => { if (e.key === 'Escape') { e.stopPropagation(); done(false); } };
    document.addEventListener('keydown', kd, true);
    m.onclick = e => { const b = e.target.closest('[data-a]'); if (b) done(b.dataset.a === '1'); else if (e.target === m) done(false); };
    $('[data-a="1"]', m).focus();
  });
}

const CHECK_DP = { kNm: 1, kN: 1, mm: 1, MPa: 2, 'mm²': 0, '': 3, m: 2, min: 0, 'szt.': 0 };
function ckVal(c, v) { if (c.fmt === 'text') return ''; return fmt(v, CHECK_DP[c.unit] ?? 2); }
function ckCond(c) {
  if (c.fmt === 'text') return c.EdTxt ? `${esc(c.RdTxt)} ≥ ${esc(c.EdTxt)}` : '';
  const u = c.unit ? ' ' + c.unit : '';

  if (inHost()) { const r = await hostCall('save', { path: '', name, content: doc, filter: 'html' }); if (r && r.ok) toast('Zapisano raport: ' + baseName(r.path)); else if (r && r.err) toast('Błąd: ' + r.err); }
  else if (ART) await offerFile(name, doc, 'Raport pobrany – otwórz go i wydrukuj (Ctrl+P).');
  else download(name, doc, 'text/html');
}
async function exportODT() {
  if (!R || R.errors.length) { toast('Usuń błędy danych przed eksportem raportu.'); return; }
  const name = safeName(' – raport.odt');
  toast('Tworzenie pliku .odt…', 1500);
  let u; try { u = await window.SZR.odt(repBody(), (S.meta.name || 'Słup') + ' – raport obliczeń'); } catch (e) { console.error(e); toast('Błąd tworzenia .odt: ' + e.message); return; }
  if (inHost()) { let b = ''; for (let i = 0; i < u.length; i += 0x8000) b += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); const r = await hostCall('save', { path: '', name, content: btoa(b), b64: true, filter: 'odt' }); if (r && r.ok) toast('Zapisano raport: ' + baseName(r.path)); else if (r && r.err) toast('Błąd: ' + r.err); return; }
  const blob = new Blob([u], { type: 'application/vnd.oasis.opendocument.text' });
  if (ART) { await offerFile(name, blob, 'Raport .odt pobrany.'); return; }
  download(name, blob);
}
async function exportDXF() {
  if (!R || R.errors.length || !R.lay.n) { toast('Najpierw zadaj zbrojenie (zakładka Przekrój i zbrojenie).'); return; }
  let txt; try { txt = window.SZX.build(R, S); } catch (e) { console.error(e); toast('Błąd tworzenia DXF: ' + e.message); return; }
  const name = safeName(' – zbrojenie.dxf');
  if (inHost()) { const r = await hostCall('save', { path: '', name, content: txt, filter: 'dxf' }); if (r && r.ok) toast('Zapisano rysunek: ' + baseName(r.path)); else if (r && r.err) toast('Błąd: ' + r.err); }
  else if (ART) await offerFile(name, txt, 'Rysunek DXF pobrany.');
  else download(name, txt, 'application/dxf');
}
function doPrint() {
  if (ART) { U.selectTab('report'); if (Cap.dl) exportHTML(); return; }
  U.selectTab('report');
  setTimeout(() => window.print(), 120);
}

/* --------------------------------------------- moje projekty (konto, db) */
async function initCapabilities() {
  if (!ART || !window.claude || typeof window.claude.use !== 'function') return;
  window.claude.use('downloads').then(dl => { Cap.dl = dl || null; $('#bExport').hidden = !Cap.dl; rendered.report = false; }, () => { /* */ });
  try {
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!db || !user) return;
    const uid = await user.id(); if (!uid) return;
    Cap.db = db; Cap.uid = uid; Cap.col = db.collection('data/users/' + uid);
    $('#bCloud').hidden = false;
    const tmo = setTimeout(() => { if (!Cap.ready) { Cap.slow = true; renderCloud(); } }, 10000);
    Cap.col.orderBy('saved', 'desc').onSnapshot(snap => {
      Cap.list = snap.docs.filter(d => d.exists).map(d => Object.assign({ id: d.id }, d.data()));
      if (!snap.metadata.fromCache) { Cap.ready = true; Cap.slow = false; clearTimeout(tmo); }
      renderCloud();
    }, e => { Cap.err = e && e.code; Cap.ready = true; clearTimeout(tmo); renderCloud(); });
  } catch (e) { /* bez zapisu na koncie */ }
}
const fmtDate = iso => { try { const d = new Date(iso); return d.toLocaleDateString('pl-PL') + ' ' + d.toLocaleTimeString('pl-PL', { hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } };
let cloudOpen = false;
function openCloud() { cloudOpen = true; renderCloud(); $('#modal').style.display = 'flex'; }
function renderCloud() {
  if (!cloudOpen) return;
  const m = $('#modal'); let list;
  if (Cap.err) list = `<p class="pempty">Nie udało się odczytać zapisanych projektów (${esc(Cap.err)}). Zapis do pliku nadal działa.</p>`;
  else if (!Cap.ready && !Cap.list.length) list = `<p class="pempty">${Cap.slow ? 'Nie można teraz połączyć się z zapisanymi projektami.' : 'Wczytywanie zapisanych projektów…'}</p>`;
  else if (!Cap.list.length) list = `<p class="pempty">Nie masz jeszcze zapisanych projektów. Kliknij „Zapisz bieżący”.</p>`;
  else list = `<ul class="plist">${Cap.list.map(p => `<li class="${p.id === cloudId ? 'cur' : ''}"><div class="pn"><b>${esc(p.name || 'bez nazwy')}</b><small>zapisano ${esc(fmtDate(p.saved))}${p.summary ? ' · ' + esc(p.summary) : ''}</small></div><button class="btn" data-po="${esc(p.id)}">Otwórz</button><button class="btn dng" data-pd="${esc(p.id)}">Usuń</button></li>`).join('')}</ul>`;
  m.innerHTML = `<div class="dlg"><h3>Moje projekty</h3><p>Projekty zapisane na Twoim koncie claude.ai – widoczne tylko dla Ciebie.</p><div class="dbtn" style="justify-content:flex-start;margin-top:8px"><button class="btn pri" id="pcSave">${cloudId ? 'Zapisz zmiany' : 'Zapisz bieżący'}</button>${cloudId ? '<button class="btn" id="pcNew">Zapisz jako nowy</button>' : ''}${Cap.dl ? '<button class="btn" id="pcFile">Pobierz plik .json</button>' : ''}</div>${list}<div class="dbtn"><button class="btn" id="pcClose">Zamknij</button></div></div>`;
  m.style.display = 'flex';
  $('#pcClose', m).onclick = () => { cloudOpen = false; m.style.display = 'none'; };
  $('#pcSave', m).onclick = () => cloudSave(false);
  if ($('#pcNew', m)) $('#pcNew', m).onclick = () => cloudSave(true);
  if ($('#pcFile', m)) $('#pcFile', m).onclick = () => offerFile(safeName('.json'), projectJSON(), 'Plik projektu pobrany.');
  $$('[data-po]', m).forEach(b => b.onclick = () => cloudLoad(b.dataset.po));
  $$('[data-pd]', m).forEach(b => b.onclick = () => cloudDelete(b.dataset.pd));
}
const summaryLine = () => `${CIRC(S) ? '⌀' + S.geom.D : S.geom.b + '×' + S.geom.h} mm, l = ${String(S.geom.L).replace('.', ',')} m, ${S.mat.concrete}` + (R && R.checks ? (R.ok ? ' · OK' : ' · niespełnione warunki') : '');
let cloudBusy = false;
async function cloudSave(asNew) {
  if (!Cap.col || cloudBusy) return; cloudBusy = true;
  const ref = (!asNew && cloudId) ? Cap.col.doc(cloudId) : Cap.col.doc();
  const body = JSON.parse(JSON.stringify(Object.assign({ app: 'SlupZB', version: 1, name: S.meta.name || 'bez nazwy', saved: new Date().toISOString(), summary: summaryLine(), state: S }, colsOut())));
  try {
    try { await ref.set(body); } catch (e) { if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 600)); await ref.set(body); } else throw e; }
    cloudId = ref.id; cloudName = body.name; dirty = false; updateTitle(); autosave(); toast('Zapisano na koncie: ' + body.name); renderCloud();
  } catch (e) { const c = e && e.code; toast(c === 'quota_exceeded' ? 'Brak miejsca – usuń niepotrzebne projekty.' : 'Nie udało się zapisać' + (c ? ` (${c})` : '') + '.', 4000); }
  finally { cloudBusy = false; }
}
async function cloudLoad(id) {
  const p = Cap.list.find(x => x.id === id); if (!p) return;
  if (dirty && id !== cloudId && !(await ask('Niezapisane zmiany zostaną utracone. Otworzyć projekt „' + esc(p.name || '') + '”?', 'Otwórz'))) { renderCloud(); return; }
  cloudOpen = false; $('#modal').style.display = 'none'; cloudId = p.id; cloudName = p.name || '';
  applyState(colsIn(p, p.state || {}), '', true); toast('Otwarto: ' + (p.name || 'projekt'));
}
async function cloudDelete(id) {
  const p = Cap.list.find(x => x.id === id); if (!p) return;
  if (await ask(`Usunąć projekt „${esc(p.name || 'bez nazwy')}” z konta? Tej operacji nie można cofnąć.`, 'Usuń', true)) {
    try { await Cap.col.doc(id).delete(); if (id === cloudId) { cloudId = null; cloudName = ''; updateTitle(); autosave(); } toast('Usunięto projekt.'); }
    catch (e) { toast('Nie udało się usunąć projektu' + (e && e.code ? ` (${e.code})` : '') + '.'); }
  }
  openCloud();
}

function about() {
  const m = $('#modal');
  m.innerHTML = `<div class="dlg"><h3>SłupŻB 1.0 – słupy żelbetowe wg Eurokodu 2</h3>
  <p>Wymiarowanie i sprawdzanie słupów żelbetowych wg PN-EN 1992-1-1 (parametry krajowe wg Załącznika Krajowego PL: γ<sub>c</sub> = 1,4, γ<sub>s</sub> = 1,15, α<sub>cc</sub> = 1,0, ⌀<sub>min</sub> = 12 mm), kombinacje wg PN-EN 1990, odporność ogniowa wg PN-EN 1992-1-2 (metoda A).</p>
  <ul>
  <li><b>Przekroje</b> – prostokątne b × h i okrągłe ⌀D; pręty narożne i pośrednie o różnych średnicach, szpilki dobierane z warunku 9.5.3(6).</li>
  <li><b>Statyka</b> – słup jako pręt o schemacie podparcia w każdej płaszczyźnie (przegub–przegub, wspornik, utwierdzenie–przegub, utwierdzenie–utwierdzenie, utwierdzenie przesuwne); siły N z mimośrodem, momenty końcowe z analizy ramy, siły poziome w głowicy i obciążenie poziome na wysokości; ciężar własny.</li>
  <li><b>Kombinacje</b> – automatycznie (6.10 lub 6.10a/b, każde obciążenie zmienne obecne lub nie, kolejno wiodące, wiatr ±, γ<sub>G,sup</sub>/γ<sub>G,inf</sub>), charakterystyczne i quasi-stałe; albo siły obliczeniowe wprost.</li>
  <li><b>Smukłość i II rząd</b> – długość wyboczeniowa (rys. 5.7, wzory 5.15/5.16), imperfekcje 5.2, λ<sub>lim</sub> (5.13N) z A, B, C, pełzanie efektywne φ<sub>ef</sub> (5.19); metody nominalnej krzywizny (5.8.8), nominalnej sztywności (5.8.7) i ogólna (5.8.6, nieliniowa M–κ, słup modelowy); mimośród minimalny e₀.</li>
  <li><b>Nośność</b> – zgodność odkształceń (parabola-prostokąt lub prostokąt), krzywe interakcji N–M w obu płaszczyznach, zginanie ukośne wg 5.8.9 (5.38a,b i 5.39) oraz kontur M<sub>y</sub>–M<sub>z</sub> metodą włókien; ścinanie 6.2 z wpływem siły ściskającej.</li>
  <li><b>SGU</b> – naprężenia 7.2 i szerokość rys 7.3.4; <b>konstrukcja</b> – rozdz. 9.5 (A<sub>s,min</sub>, A<sub>s,max</sub>, ⌀<sub>min</sub>, strzemiona, rozstaw, strefy zagęszczenia, szpilki), 8.2, zakłady 8.7 i zakotwienia 8.4; <b>pożar</b> – tab. 5.2a i wzór (5.7).</li>
  <li><b>Dobór</b> – zbrojenia (najmniejsza masa stali), przekroju i wszystkiego; rysunek zbrojenia, wyciągi, zestawienie stali, eksport DXF; raport z pełnym tokiem obliczeń (HTML, .odt, PDF).</li></ul>
  <p>Skróty: F2 – raport, Ctrl+S – zapisz, Ctrl+O – otwórz, Ctrl+P – drukuj raport.</p>
  <p style="font-size:12px;color:var(--ink3)">Program jest narzędziem pomocniczym. Wyniki wymagają weryfikacji przez osobę z odpowiednimi uprawnieniami budowlanymi.</p>
  <div class="dbtn"><button class="btn pri" id="abClose">Zamknij</button></div></div>`;
  m.style.display = 'flex'; $('#abClose', m).onclick = closeModal;
}

/* -------------------------------------------------------------- start */
function init() {
  let saved = window.__AUTOSAVE || null;
  if (!saved) { try { saved = JSON.parse(localStorage.getItem('slupzb-autosave') || 'null'); } catch (e) { saved = null; } }
  if (saved && saved.state) { try { S = E.normalize(colsIn(saved, saved.state)); filePath = saved.filePath || ''; cloudId = saved.cloudId || null; cloudName = saved.cloudName || ''; } catch (e) { S = E.defaultState(); } }
  if (ART) { $('#bPrint').hidden = true; $('#bSaveAs').hidden = true; $('#bExport').hidden = true; }
  $('#projName').value = S.meta.name || '';
  $('#projName').addEventListener('input', e => { S.meta.name = e.target.value; dirty = true; updateTitle(); autosave(); rendered.report = false; const bt = $(`.btab[data-ctab="${curC}"] span`); if (bt) bt.textContent = S.meta.name.slice(0, 14); });
  $$('.tabs button').forEach(b => b.addEventListener('click', () => {
    $$('.tabs button').forEach(x => x.classList.toggle('on', x === b));
    $$('.pane').forEach(p => p.classList.toggle('on', p.id === 'p-' + b.dataset.tab));
    renderActive();
  }));
  $$('[data-act]').forEach(b => b.addEventListener('click', () => ({ new: newProject, open: openFile, save: () => saveFile(false), saveas: () => saveFile(true), cloud: openCloud, print: doPrint, exporthtml: exportHTML, about })[b.dataset.act]()));
  document.addEventListener('keydown', e => {
    const k = e.key.toLowerCase();
    if (!ART && (e.key === 'F5' || (e.ctrlKey && k === 'r'))) { e.preventDefault(); return; }
    if ($('#modal').style.display === 'flex' && e.key !== 'Escape') return;
    if (e.ctrlKey && k === 's') { e.preventDefault(); saveFile(e.shiftKey); }
    else if (e.ctrlKey && k === 'o') { e.preventDefault(); openFile(); }
    else if (e.ctrlKey && k === 'n' && !ART) { e.preventDefault(); newProject(); }
    else if (e.ctrlKey && k === 'p') { e.preventDefault(); doPrint(); }
    else if (e.key === 'F2') { e.preventDefault(); U.selectTab('report'); }
    else if (e.key === 'Escape') { closeList(); cloudOpen = false; closeModal(); }
  });
  $('#modal').addEventListener('mousedown', e => { if (e.target.id === 'modal' && !$('[data-a]', e.currentTarget)) { cloudOpen = false; closeModal(); } });
  let rz = null, lastW = window.innerWidth;
  window.addEventListener('resize', () => { if (Math.abs(window.innerWidth - lastW) < 40) return; lastW = window.innerWidth; clearTimeout(rz); rz = setTimeout(() => { rendered = {}; renderActive(); }, 150); });
  // przeciągany podział Danych
  const sp = $('#dsplit'); if (sp) { let drag = false; sp.addEventListener('mousedown', e => { drag = true; e.preventDefault(); }); window.addEventListener('mouseup', () => { if (drag) { drag = false; rendered.data = false; renderActive(); } }); window.addEventListener('mousemove', e => { if (!drag) return; const w = $('.datawrap'), r = w.getBoundingClientRect(), f = Math.max(0.3, Math.min(0.75, (e.clientX - r.left) / r.width)); w.style.setProperty('--dsl', (f * 100).toFixed(1) + '%'); }); sp.addEventListener('dblclick', () => { $('.datawrap').style.removeProperty('--dsl'); rendered.data = false; renderActive(); }); }
  renderInputs(); recalc(); updateTitle(); initCapabilities();
}
U.setState = s => { S = E.normalize(s); selCombo = null; renderInputs(); recalc(); };
U.getState = () => S;
U.selectTab = t => $(`.tabs button[data-tab="${t}"]`).click();
U.recalc = () => recalc();
if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
